[podcast]
title = "The AI,MATH & Physics Podcast〜探求と学びの垂れ流し〜"
description = "AI・数学（モジュラー曲線・群論・整数論など）・物理・ソフトウェア開発ツールなどの話題を垂れ流すポッドキャスト。AIで自動生成。"
cover_image = "cover.png"
# site_url は gh コマンドで自動導出。カスタムドメインの場合のみ明示する。
# site_url = "https://example.com"

[tts]
model = "gemini-3.1-flash-tts-preview"
response_format = "wav"
instructions = "これは2人のスピーカーによるポッドキャストの会話です。自然な会話のトーンで、スピーカーの切り替わりに適切な間を置いて話してください。Hostが議論をリードし、CoHostは質問をしながら興味深く反応します。"
selection_mode = "random"                                                                                                # fixed | random

[tts.speakers.host]
name = "Host"
voice_name = "Charon"
description = "ポッドキャストの進行役。テーマをわかりやすく解説し、会話をリードする。"
tone = "落ち着いて信頼感のある進行"
voice_options = [
    "Charon",
    "Achird",
    "Puck",
    "Kore",
    "Fenrir",
    "Aoede",
    "Leda",
    "Orus",
    "Zephyr",
    "Callirrhoe",
]
tone_options = [
    "とても楽しげで勢いのある進行",
    "明るく元気でテンポの良い進行",
    "落ち着いて信頼感のある進行",
    "柔らかく丁寧で包み込む進行",
    "若々しくフレッシュな進行",
    "知的でクールな進行",
    "熱量高めでワクワク感のある進行",
    "深夜ラジオのようにしっとりした進行",
    "親密で距離の近い進行",
    "上品でゆったりした進行",
]

[tts.speakers.cohost]
name = "CoHost"
voice_name = "Achird"
description = "コ・ホスト。聴衆の代わりに質問し、ホストの話に興味深く反応する。"
tone = "親しみやすく好奇心のある受け答え"
voice_options = [
    "Achird",
    "Charon",
    "Puck",
    "Kore",
    "Fenrir",
    "Aoede",
    "Leda",
    "Orus",
    "Zephyr",
    "Callirrhoe",
]
tone_options = [
    "とても楽しげでリアクション豊かな受け答え",
    "明るく元気で軽快な受け答え",
    "落ち着いたトーンで的確な受け答え",
    "柔らかく優しい受け答え",
    "若々しくフレッシュな受け答え",
    "知的でロジカルな受け答え",
    "驚きや発見を素直に表す受け答え",
    "深夜ラジオのように穏やかな受け答え",
    "親密でフランクな受け答え",
    "上品で聞き心地の良い受け答え",
]

[generator]
model = "gemini-3-flash-preview"
system_instruction = """
あなたは一流のポッドキャスト・プロデューサーです。
入力された記事の内容をもとに、ホスト（Host）とコ・ホスト（CoHost）による
対話形式ポッドキャスト台本を日本語で作成してください。

"""
prompt_template = """以下が記事の内容です。

===== ここから =====

{content}

===== ここまで =====

これを元に、ホスト（Host）とコ・ホスト（CoHost）による対話形式ポッドキャスト台本を日本語で作成してください。

【役割】
- Host: 進行役。テーマを深く掘り下げ、背景知識や具体例を交えて会話をリードする。
- CoHost: 聞き手。聴衆の代わりに鋭い質問を投げかけ、驚きや納得のリアクションで対話を盛り上げる。

【構成】
1. 前置き: Host が番組とテーマを導入。CoHost と共に今日の見どころを語る。
2. 本編: 記事のポイントを順に解説。記事のポイントは主要なものだけ取り出すのではなく極力すべて解説する。各セリフは短くまとめすぎず、背景や比喩、実例を交えて肉厚な対話にする。
3. まとめ: 全体の要点を振り返り、今後の展望やリスナーへの問いかけを含めて締める。

【文字数・情報密度】
- 合計 5,000〜6,000文字（音声で約1〜2分）のトークスクリプトを作成してください。ホストとコホストのやりとりが10ターンくらいになるのが目安です。
- 各スピーカーは、単なる事実の羅列ではなく、納得感のある説明や、聞き手がイメージしやすい具体的なエピソードを詳しく話してください。
- 一回の発言が長くなっても構いませんので、内容を削らずに豊かな対話を作成してください。

【わかりやすさの原則】
- 専門用語は初出時に必ず平易な言葉で言い換える。
- 数式・記号は音声で伝わるよう日本語で読み下す（例: M₁₁ →「エム11」、|G| →「Gの絶対値、つまり要素の数」）。
- 難解な概念は身近な比喩（例:「群は操作のルールブック」）で噛み砕く。
- 聴衆が「耳だけ」で理解できることを最優先にする。

【語調】
- Host: 落ち着いた、信頼感のある丁寧な口調。
- CoHost: 好奇心旺盛で、初心者にもわかりやすい視点を持つ。

"""

[gemini]
#api_root = "http://host.docker.internal:8099"
api_path = "/v1beta"

[download]
monitor_interval_seconds = 60

[tui.markdown]
math_label = "ᵐ"
