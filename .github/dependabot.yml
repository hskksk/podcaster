# Dependabot version updates (security updates are enabled in repo settings).
# Commit/PR titles use chore(deps): … so lint-pr conventional-commit checks pass.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # pnpm workspace: single lockfile at repository root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: terraform
    directory: /infra/gcp/audio-transcode
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /services/audio-transcode
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope