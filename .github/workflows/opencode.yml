name: opencode

# 通常（変更があれば PR）: /oc, /opencode
# 調査用 github-reply: /oci, /oca, /oc-issue, /oc-ask, /opencode-issue, /opencode-ask
#
# モデル（省略時 opencode/big-pickle = Big Pickle / Zen 無料）:
#   /oc --model kimi-k3
#   /oc model:opencode-go/kimi-k3
#   /oc opencode/kimi-k2.5
#   /oc big-pickle
# Go 系は model ID のみでも可（例: /oc --model glm-5.3-flash → opencode-go/glm-5.3-flash）
#
# Secrets:
#   OPENCODE_API_KEY     — OpenCode Zen（Big Pickle および opencode/*）
#   OPENCODE_GO_API_KEY  — OpenCode Go サブスク（opencode-go/*）
#
# トリガー権限: OWNER / MEMBER / COLLABORATOR のコメント、または write 以上のコラボレーターが
# Issue/PR 本文を編集した場合。追加ログインは repo variable OPENCODE_TRIGGER_ALLOWLIST（カンマ区切り）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  opencode:
    if: |
      !contains(fromJSON('["cursor[bot]","github-actions[bot]","opencode-agent[bot]"]'), github.actor) &&
      (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
        ) ||
        (
          github.event_name == 'issues' &&
          !github.event.issue.pull_request &&
          (contains(github.event.issue.body || '', '/oc') || contains(github.event.issue.body || '', '/opencode'))
        ) ||
        (
          github.event_name == 'pull_request' &&
          (contains(github.event.pull_request.body || '', '/oc') || contains(github.event.pull_request.body || '', '/opencode'))
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve slash command
        id: slash
        uses: actions/github-script@v7
        env:
          OPENCODE_TRIGGER_ALLOWLIST: ${{ vars.OPENCODE_TRIGGER_ALLOWLIST }}
        with:
          script: |
            const ALLOWLIST = (process.env.OPENCODE_TRIGGER_ALLOWLIST || "")
              .split(/[, \n]+/)
              .map((s) => s.trim().replace(/^@/, ""))
              .filter(Boolean);
            const TRUSTED_COMMENT_ASSOC = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const TRUSTED_REPO_PERMS = new Set(["admin", "maintain", "write"]);

            const DEFAULT_MODEL = "opencode/big-pickle";
            const MODEL_ALIASES = {
              "big-pickle": DEFAULT_MODEL,
              pickle: DEFAULT_MODEL,
            };
            const ALLOWED_MODEL = /^(opencode|opencode-go)\/[a-z0-9][a-z0-9._-]*$/i;
            const ALL_CMDS = [
              "/opencode-issue",
              "/opencode-ask",
              "/oc-issue",
              "/oc-ask",
              "/oci",
              "/oca",
              "/opencode",
              "/oc",
            ];

            function isAllowlisted(login) {
              return Boolean(login && ALLOWLIST.includes(login));
            }

            function commentActorAuthorized(comment) {
              if (!comment?.user || comment.user.type === "Bot") return false;
              if (isAllowlisted(comment.user.login)) return true;
              return TRUSTED_COMMENT_ASSOC.has(comment.author_association);
            }

            async function senderActorAuthorized(login) {
              if (!login) return false;
              if (isAllowlisted(login)) return true;
              if (login === context.repo.owner) return true;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: login,
                });
                return TRUSTED_REPO_PERMS.has(data.permission);
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function triggerActorAuthorized(eventName, payload) {
              if (eventName === "issue_comment" || eventName === "pull_request_review_comment") {
                return commentActorAuthorized(payload.comment);
              }
              if (eventName === "issues" || eventName === "pull_request") {
                return senderActorAuthorized(payload.sender?.login);
              }
              return false;
            }

            const REPLY_CMDS = [
              "/opencode-issue",
              "/opencode-ask",
              "/oc-issue",
              "/oc-ask",
              "/oci",
              "/oca",
            ];
            const BUILD_CMDS = ["/opencode", "/oc"];

            function triggerBody() {
              const eventName = context.eventName;
              if (eventName === "issue_comment" || eventName === "pull_request_review_comment") {
                return context.payload.comment?.body ?? "";
              }
              if (eventName === "issues") {
                return context.payload.issue?.body ?? "";
              }
              if (eventName === "pull_request") {
                return context.payload.pull_request?.body ?? "";
              }
              return "";
            }

            function stripNonTriggerSections(body) {
              return body
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/```[\s\S]*?```/g, "");
            }

            function hasCmdInText(body, cmd) {
              let from = 0;
              while (from <= body.length) {
                const i = body.indexOf(cmd, from);
                if (i === -1) return false;
                const beforeOk = i === 0 || body[i - 1] === " " || body[i - 1] === "\n";
                const end = i + cmd.length;
                const afterOk =
                  end === body.length ||
                  body[end] === " " ||
                  body[end] === "\n" ||
                  body[end] === "\r";
                if (beforeOk && afterOk) return true;
                from = i + 1;
              }
              return false;
            }

            function hasCmdAtLineStart(body, cmd) {
              for (const line of body.split(/\r?\n/)) {
                const trimmed = line.trim();
                if (trimmed === cmd || trimmed.startsWith(`${cmd} `)) {
                  return true;
                }
              }
              return false;
            }

            function detectMode(rawBody, eventName) {
              const isComment =
                eventName === "issue_comment" || eventName === "pull_request_review_comment";
              const body = isComment ? rawBody : stripNonTriggerSections(rawBody);
              const matches = (cmd) =>
                isComment ? hasCmdInText(body, cmd) : hasCmdAtLineStart(body, cmd);

              for (const cmd of REPLY_CMDS) {
                if (matches(cmd)) return "reply";
              }
              for (const cmd of BUILD_CMDS) {
                if (matches(cmd)) return "build";
              }
              return "";
            }

            function normalizeModelId(raw) {
              const token = raw.trim().replace(/^["']|["']$/g, "");
              if (!token) return DEFAULT_MODEL;
              const alias = MODEL_ALIASES[token.toLowerCase()];
              if (alias) return alias;
              if (token.includes("/")) {
                if (!ALLOWED_MODEL.test(token)) {
                  core.warning(`Invalid model "${token}"; using ${DEFAULT_MODEL}.`);
                  return DEFAULT_MODEL;
                }
                return token;
              }
              if (/^[a-z0-9][a-z0-9._-]*$/i.test(token)) {
                return `opencode-go/${token}`;
              }
              core.warning(`Invalid model "${token}"; using ${DEFAULT_MODEL}.`);
              return DEFAULT_MODEL;
            }

            function findTriggerLine(body, eventName) {
              const isComment =
                eventName === "issue_comment" || eventName === "pull_request_review_comment";
              const working = isComment ? body : stripNonTriggerSections(body);
              const lines = working.split(/\r?\n/);

              for (const line of lines) {
                const trimmed = line.trim();
                for (const cmd of ALL_CMDS) {
                  if (isComment) {
                    if (hasCmdInText(line, cmd)) return line;
                  } else if (trimmed === cmd || trimmed.startsWith(`${cmd} `)) {
                    return trimmed;
                  }
                }
              }
              return "";
            }

            function looksLikeModelToken(token) {
              if (!token || token.startsWith("@") || token.startsWith("#")) return false;
              if (MODEL_ALIASES[token.toLowerCase()]) return true;
              if (token.includes("/")) return ALLOWED_MODEL.test(token);
              return /^[a-z0-9][a-z0-9._-]*$/i.test(token);
            }

            function parseModelFromBody(body, eventName) {
              const cmdLine = findTriggerLine(body, eventName);
              if (!cmdLine) {
                return { model: DEFAULT_MODEL, prompt: body };
              }

              let model = DEFAULT_MODEL;
              let cleanedLine = cmdLine;

              const flagMatch = cmdLine.match(/(?:^|\s)(?:--model|-m|model:)\s+(\S+)/i);
              if (flagMatch) {
                model = normalizeModelId(flagMatch[1]);
                cleanedLine = cmdLine
                  .replace(/(?:^|\s)(?:--model|-m|model:)\s+\S+/i, "")
                  .replace(/\s{2,}/g, " ")
                  .trim();
              } else {
                for (const cmd of ALL_CMDS) {
                  const escaped = cmd.replace(/\//g, "\\/");
                  const re = new RegExp(`(${escaped})\\s+(\\S+)`, "i");
                  const match = cmdLine.match(re);
                  if (match && looksLikeModelToken(match[2])) {
                    model = normalizeModelId(match[2]);
                    cleanedLine = cmdLine.replace(re, "$1").replace(/\s{2,}/g, " ").trim();
                    break;
                  }
                }
              }

              if (cleanedLine === cmdLine) {
                return { model, prompt: body };
              }

              const prompt = body.includes(cmdLine)
                ? body.replace(cmdLine, cleanedLine)
                : body;
              return { model, prompt };
            }

            const eventName = context.eventName;
            const body = triggerBody();
            const mode = detectMode(body, eventName);
            if (!mode) {
              core.info("No opencode slash command in trigger text; skipping OpenCode run.");
              core.setOutput("mode", "skip");
              return;
            }

            const authorized = await triggerActorAuthorized(eventName, context.payload);
            if (!authorized) {
              core.info("Trigger actor is not authorized for opencode; skipping OpenCode run.");
              core.setOutput("mode", "skip");
              return;
            }

            const { model, prompt } = parseModelFromBody(body, eventName);
            core.info(`OpenCode model: ${model}`);
            core.setOutput("mode", mode);
            core.setOutput("prompt", prompt);
            core.setOutput("model", model);

      - name: Run opencode (github-reply)
        if: steps.slash.outputs.mode == 'reply'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ steps.slash.outputs.model }}
          agent: github-reply
          prompt: ${{ steps.slash.outputs.prompt }}

      - name: Run opencode
        if: steps.slash.outputs.mode == 'build'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        with:
          model: ${{ steps.slash.outputs.model }}
          prompt: ${{ (github.event_name == 'issues' || github.event_name == 'pull_request') && steps.slash.outputs.prompt || '' }}
