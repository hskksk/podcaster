name: opencode

# 通常（変更があれば PR）: /oc, /opencode
# 調査用 github-reply: /oci, /oca, /oc-issue, /oc-ask, /opencode-issue, /opencode-ask

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  opencode:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
      ) ||
      (
        github.event_name == 'issues' &&
        !github.event.issue.pull_request &&
        (contains(github.event.issue.body || '', '/oc') || contains(github.event.issue.body || '', '/opencode'))
      ) ||
      (
        github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.body || '', '/oc') || contains(github.event.pull_request.body || '', '/opencode'))
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve slash command
        id: slash
        uses: actions/github-script@v7
        with:
          script: |
            const REPLY_CMDS = [
              "/opencode-issue",
              "/opencode-ask",
              "/oc-issue",
              "/oc-ask",
              "/oci",
              "/oca",
            ];
            const BUILD_CMDS = ["/opencode", "/oc"];

            function triggerBody() {
              const eventName = context.eventName;
              if (eventName === "issue_comment" || eventName === "pull_request_review_comment") {
                return context.payload.comment?.body ?? "";
              }
              if (eventName === "issues") {
                return context.payload.issue?.body ?? "";
              }
              if (eventName === "pull_request") {
                return context.payload.pull_request?.body ?? "";
              }
              return "";
            }

            function hasCmd(body, cmd) {
              let from = 0;
              while (from <= body.length) {
                const i = body.indexOf(cmd, from);
                if (i === -1) return false;
                const beforeOk = i === 0 || body[i - 1] === " " || body[i - 1] === "\n";
                const end = i + cmd.length;
                const afterOk =
                  end === body.length ||
                  body[end] === " " ||
                  body[end] === "\n" ||
                  body[end] === "\r";
                if (beforeOk && afterOk) return true;
                from = i + 1;
              }
              return false;
            }

            function detectMode(body) {
              for (const cmd of REPLY_CMDS) {
                if (hasCmd(body, cmd)) return "reply";
              }
              for (const cmd of BUILD_CMDS) {
                if (hasCmd(body, cmd)) return "build";
              }
              return "";
            }

            const body = triggerBody();
            const mode = detectMode(body);
            if (!mode) {
              core.setFailed("No supported opencode slash command found in trigger text.");
              return;
            }

            core.setOutput("mode", mode);
            core.setOutput("prompt", body);

      - name: Run opencode (github-reply)
        if: steps.slash.outputs.mode == 'reply'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          agent: github-reply
          prompt: ${{ steps.slash.outputs.prompt }}

      - name: Run opencode
        if: steps.slash.outputs.mode == 'build'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: ${{ (github.event_name == 'issues' || github.event_name == 'pull_request') && steps.slash.outputs.prompt || '' }}
