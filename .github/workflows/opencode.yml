name: opencode

# 通常（変更があれば PR）: /oc, /opencode
# 調査用 github-reply: /oci, /oca, /oc-issue, /oc-ask, /opencode-issue, /opencode-ask
#
# モデル（省略時 opencode/big-pickle = Big Pickle / Zen 無料）:
#   /oc --model kimi-k3
#   /oc model:opencode-go/kimi-k3
#   /oc opencode/kimi-k2.5
#   /oc big-pickle
# Go 系は model ID のみでも可（例: /oc --model glm-5.3-flash → opencode-go/glm-5.3-flash）
#
# Secrets:
#   OPENCODE_API_KEY     — OpenCode Zen（Big Pickle および opencode/*）
#   OPENCODE_GO_API_KEY  — OpenCode Go サブスク（opencode-go/*）
#
# トリガー権限: OWNER / MEMBER / COLLABORATOR のコメント、または write 以上のコラボレーターが
# Issue/PR 本文を編集した場合。追加ログインは repo variable OPENCODE_TRIGGER_ALLOWLIST（カンマ区切り）。
#
# /oc build: github-actions エージェントが scripts/opencode-github-progress.sh で
# 開始・調査・下書きPR・実装・検証・提出の区切りごとにトリガー Issue/PR へ短いコメントを付ける。
# 検証完了前でも下書き PR を早めに上げ、別 run / 別エージェントが引き継げるようにする。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  opencode:
    permissions:
      id-token: write
    uses: hskksk/gh-actions/.github/workflows/opencode.yml@v1
    secrets: inherit
    with:
      toolchain: pnpm
      pnpm-version: "9.14.0"
      node-version: "24"
      trigger-allowlist: ${{ vars.OPENCODE_TRIGGER_ALLOWLIST }}
