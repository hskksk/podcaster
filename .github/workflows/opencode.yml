name: opencode

# Reply-only (no PR): include phrases such as
#   issueにコメント / コメントのみ / PRを作らない / comment on the issue
# or trigger with only `/oc` / `/opencode` (summarize thread).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  opencode:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (
          contains(github.event.comment.body, ' /oc') ||
          startsWith(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, ' /opencode') ||
          startsWith(github.event.comment.body, '/opencode')
        )
      ) ||
      (
        github.event_name == 'issues' &&
        !github.event.issue.pull_request &&
        (
          contains(github.event.issue.body || '', ' /oc') ||
          startsWith(github.event.issue.body || '', '/oc') ||
          contains(github.event.issue.body || '', ' /opencode') ||
          startsWith(github.event.issue.body || '', '/opencode')
        )
      ) ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.body || '', ' /oc') ||
          startsWith(github.event.pull_request.body || '', '/oc') ||
          contains(github.event.pull_request.body || '', ' /opencode') ||
          startsWith(github.event.pull_request.body || '', '/opencode')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect reply-only mode
        id: mode
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const commentBody = context.payload.comment?.body ?? "";
            const issueBody = context.payload.issue?.body ?? "";
            const prBody = context.payload.pull_request?.body ?? "";

            let triggerBody = "";
            if (eventName === "issue_comment" || eventName === "pull_request_review_comment") {
              triggerBody = commentBody;
            } else if (eventName === "issues") {
              triggerBody = issueBody;
            } else if (eventName === "pull_request") {
              triggerBody = prBody;
            }

            const trimmed = triggerBody.trim();
            const lower = triggerBody.toLowerCase();

            const replyOnly =
              /^\/oc$/i.test(trimmed) ||
              /^\/opencode$/i.test(trimmed) ||
              /issue\s*に\s*コメント/i.test(triggerBody) ||
              /イシューにコメント/i.test(triggerBody) ||
              /コメント(?:のみ|だけ)/i.test(triggerBody) ||
              /(?:^|\s)(?:comment|reply)\s+(?:on|to)\s+(?:the\s+)?issue/i.test(lower) ||
              /PR(?:を|は)?(?:作らない|不要|いらない)/i.test(triggerBody) ||
              /\bno\s+pr\b/i.test(lower);

            core.setOutput("reply_only", replyOnly ? "true" : "false");

            const replyPrefix =
              "REPLY-ONLY MODE: Answer in the GitHub issue thread only. " +
              "Do NOT modify files, commit, push, or open a pull request. " +
              "Read-only investigation is OK.\n\nUser request:\n";

            if (replyOnly) {
              core.setOutput("prompt", `${replyPrefix}${triggerBody}`);
            } else if (eventName === "issues" || eventName === "pull_request") {
              core.setOutput("prompt", triggerBody);
            } else {
              core.setOutput("prompt", "");
            }

      - name: Run opencode (reply on issue, no PR)
        if: steps.mode.outputs.reply_only == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          agent: github-reply
          prompt: ${{ steps.mode.outputs.prompt }}

      - name: Run opencode
        if: steps.mode.outputs.reply_only != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: ${{ steps.mode.outputs.prompt }}
