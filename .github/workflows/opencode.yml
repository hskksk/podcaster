name: opencode

# /oc-issue  — github-reply (issue コメントのみ、PR なし)
# /oc, /opencode — 通常（変更があれば PR）

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  opencode:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (
          contains(github.event.comment.body, ' /oc-issue') ||
          startsWith(github.event.comment.body, '/oc-issue') ||
          contains(github.event.comment.body, ' /opencode') ||
          startsWith(github.event.comment.body, '/opencode') ||
          (
            (contains(github.event.comment.body, ' /oc') || startsWith(github.event.comment.body, '/oc')) &&
            !contains(github.event.comment.body, ' /oc-issue') &&
            !startsWith(github.event.comment.body, '/oc-issue')
          )
        )
      ) ||
      (
        github.event_name == 'issues' &&
        !github.event.issue.pull_request &&
        (
          contains(github.event.issue.body || '', ' /oc-issue') ||
          startsWith(github.event.issue.body || '', '/oc-issue') ||
          contains(github.event.issue.body || '', ' /opencode') ||
          startsWith(github.event.issue.body || '', '/opencode') ||
          (
            (contains(github.event.issue.body || '', ' /oc') || startsWith(github.event.issue.body || '', '/oc')) &&
            !contains(github.event.issue.body || '', ' /oc-issue') &&
            !startsWith(github.event.issue.body || '', '/oc-issue')
          )
        )
      ) ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.body || '', ' /oc-issue') ||
          startsWith(github.event.pull_request.body || '', '/oc-issue') ||
          contains(github.event.pull_request.body || '', ' /opencode') ||
          startsWith(github.event.pull_request.body || '', '/opencode') ||
          (
            (contains(github.event.pull_request.body || '', ' /oc') || startsWith(github.event.pull_request.body || '', '/oc')) &&
            !contains(github.event.pull_request.body || '', ' /oc-issue') &&
            !startsWith(github.event.pull_request.body || '', '/oc-issue')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode (github-reply via /oc-issue)
        if: |
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          (contains(github.event.comment.body, ' /oc-issue') || startsWith(github.event.comment.body, '/oc-issue')) ||
          github.event_name == 'issues' &&
          (contains(github.event.issue.body || '', ' /oc-issue') || startsWith(github.event.issue.body || '', '/oc-issue')) ||
          github.event_name == 'pull_request' &&
          (contains(github.event.pull_request.body || '', ' /oc-issue') || startsWith(github.event.pull_request.body || '', '/oc-issue'))
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          agent: github-reply
          prompt: ${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && github.event.comment.body || github.event_name == 'issues' && github.event.issue.body || github.event_name == 'pull_request' && github.event.pull_request.body || '' }}

      - name: Run opencode
        if: |
          !(
            (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
            (contains(github.event.comment.body, ' /oc-issue') || startsWith(github.event.comment.body, '/oc-issue')) ||
            github.event_name == 'issues' &&
            (contains(github.event.issue.body || '', ' /oc-issue') || startsWith(github.event.issue.body || '', '/oc-issue')) ||
            github.event_name == 'pull_request' &&
            (contains(github.event.pull_request.body || '', ' /oc-issue') || startsWith(github.event.pull_request.body || '', '/oc-issue'))
          )
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: ${{ github.event_name == 'issues' && github.event.issue.body || github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
