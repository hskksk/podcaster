# Triggered by hskksk/knowledges (repository_dispatch). Hits Vercel Deploy Hook.
name: Knowledges → Vercel deploy

on:
  repository_dispatch:
    types: [knowledges-content-updated]
  workflow_dispatch:
    inputs:
      knowledge_sha:
        description: knowledges commit SHA (optional; default KNOWLEDGE_GIT_REF / lock ref)
        required: false
        type: string

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve knowledge ref
        id: ref
        run: |
          SHA="${{ github.event.client_payload.sha || inputs.knowledge_sha }}"
          if [ -n "$SHA" ]; then
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "Deploying site snapshot of knowledges @ $SHA"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Deploying site (Vercel KNOWLEDGE_GIT_REF or knowledge.lock.json ref → main)"
          fi

      - name: Content deploy (revalidate or Vercel hook)
        env:
          KNOWLEDGE_DEPLOY_MODE: ${{ vars.KNOWLEDGE_DEPLOY_MODE }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          KNOWLEDGE_REVALIDATE_URL: ${{ secrets.KNOWLEDGE_REVALIDATE_URL }}
          KNOWLEDGE_REVALIDATE_SECRET: ${{ secrets.KNOWLEDGE_REVALIDATE_SECRET }}
          KNOWLEDGE_SHA: ${{ steps.ref.outputs.ref }}
        run: |
          MODE="${KNOWLEDGE_DEPLOY_MODE:-hook}"
          if [ "$MODE" = "revalidate" ]; then
            if [ -z "$KNOWLEDGE_REVALIDATE_URL" ] || [ -z "$KNOWLEDGE_REVALIDATE_SECRET" ]; then
              echo "KNOWLEDGE_REVALIDATE_URL and KNOWLEDGE_REVALIDATE_SECRET are required for KNOWLEDGE_DEPLOY_MODE=revalidate" >&2
              exit 1
            fi
            BODY='{"tag":"knowledge","layouts":true}'
            if [ -n "$KNOWLEDGE_SHA" ]; then
              echo "Tip: set Vercel Runtime KNOWLEDGE_GIT_REF=$KNOWLEDGE_SHA so ISR tarball matches this commit."
            fi
            curl -fsS -X POST "$KNOWLEDGE_REVALIDATE_URL" \
              -H "Authorization: Bearer $KNOWLEDGE_REVALIDATE_SECRET" \
              -H "Content-Type: application/json" \
              -d "$BODY"
            echo "On-demand revalidate requested (no Vercel full build)."
            exit 0
          fi

          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set" >&2
            exit 1
          fi
          URL="$VERCEL_DEPLOY_HOOK_URL"
          if [ -n "$KNOWLEDGE_SHA" ]; then
            echo "Tip: set Vercel Build env KNOWLEDGE_GIT_REF=$KNOWLEDGE_SHA (or KNOWLEDGE_GIT_SHA) for pinned builds."
            URL="${URL}?knowledge_sha=${KNOWLEDGE_SHA}"
          fi
          curl -fsS -X POST "$URL"