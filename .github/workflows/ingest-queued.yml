# Phase 3: ingest content/** with podcast: queued, then write published.
# Capture defaults: docs queued, web-clips none. Do not queue migrated web-clips in bulk.
name: Ingest queued podcasts

on:
  push:
    branches: [main]
    paths:
      - "content/docs/**"
      - "content/web-clips/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-queued
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hskksk/gh-actions/setup-pnpm@v1
        with:
          pnpm-version: "9.14.0"
          node-version: "24"
          install: "true"
          frozen-lockfile: "false"

      - uses: hskksk/gh-actions/setup-supabase-cli@v1

      - name: Ingest queued files and write published
        env:
          INGEST_QUEUED_COMMIT: "1"
        run: pnpm ingest:queued
