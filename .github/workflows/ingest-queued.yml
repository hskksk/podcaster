# Phase 3: ingest content/** with podcast: queued, then write published.
# Capture defaults: docs queued, web-clips none. Do not queue migrated web-clips in bulk.
name: Ingest queued podcasts

on:
  push:
    branches: [main]
    paths:
      - "content/docs/**"
      - "content/web-clips/**"
  workflow_dispatch:

permissions:
  contents: write

# Keystatic may push several queued articles within seconds; serialize ingest + publish commits.
concurrency:
  group: ingest-queued-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install

      - uses: hskksk/gh-actions/actions/setup-supabase-cli@v1
        with:
          install: "false"

      - name: Ingest queued files and write published
        env:
          INGEST_QUEUED_COMMIT: "1"
        run: pnpm ingest:queued
