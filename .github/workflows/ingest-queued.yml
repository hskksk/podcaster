# Phase 3 (legacy on podcaster): moved to hskksk/knowledges — see S3 in content-platform-split.md.
# Run manually after `pnpm knowledge:checkout` if needed until the knowledges workflow exists.
name: Ingest queued podcasts

on:
  workflow_dispatch:

permissions:
  contents: write

# Keystatic may push several queued articles within seconds; serialize ingest + publish commits.
concurrency:
  group: ingest-queued-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install

      - name: Checkout knowledge corpus
        env:
          KNOWLEDGE_GITHUB_TOKEN: ${{ secrets.KNOWLEDGE_GITHUB_TOKEN }}
        run: pnpm knowledge:checkout

      - uses: hskksk/gh-actions/actions/setup-supabase-cli@v1
        with:
          install: "false"

      - name: Ingest queued files (no Git commit until knowledges workflow)
        run: pnpm ingest:queued
