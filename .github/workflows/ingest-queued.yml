# Phase 3: ingest content/** with podcast: queued, then write published.
# Capture defaults to none. Do not queue the migrated web-clips in bulk.
name: Ingest queued podcasts

on:
  push:
    branches: [main]
    paths:
      - "content/docs/**"
      - "content/web-clips/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-queued
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - uses: supabase/setup-cli@v2

      - name: Create .env
        run: |
          echo "MEM_API_KEY=${{ secrets.MEM_API_KEY }}" > .env

      - name: Ingest queued files and write published
        env:
          INGEST_QUEUED_COMMIT: "1"
        run: pnpm ingest:queued
