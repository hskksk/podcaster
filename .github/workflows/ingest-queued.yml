# Phase 3: ingest content/** with podcast: queued, then write published.
# Capture defaults: docs queued, web-clips none. Do not queue migrated web-clips in bulk.
name: Ingest queued podcasts

on:
  push:
    branches: [main]
    paths:
      - "content/docs/**"
      - "content/web-clips/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-queued
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hskksk/gh-actions/setup-mise@v1

      - run: pnpm install

      - name: Require Supabase secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "${SUPABASE_PROJECT_REF:-}" ] && missing+=(SUPABASE_PROJECT_REF)
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=(SUPABASE_DB_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets for Supabase: ${missing[*]}"
            exit 1
          fi

      - name: Ingest queued files and write published
        env:
          INGEST_QUEUED_COMMIT: "1"
        run: pnpm ingest:queued
