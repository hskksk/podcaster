name: Ingest mem.ai Note (Manual)

on:
  workflow_dispatch:
    inputs:
      mem_note_id:
        description: 'mem.ai note ID to ingest'
        required: true
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: supabase/setup-cli@v2

      - name: Create .env
        run: echo "MEM_API_KEY=${{ secrets.MEM_API_KEY }}" > .env

      - name: Ingest mem.ai note
        run: |
          pnpm tsx scripts/ingest.ts "${{ inputs.mem_note_id }}" \
            --route mem_dispatch \
            --meta "{\"workflow_run_id\":\"${{ github.run_id }}\"}"
