# Automatic PR review via dceoy/opencode-action bundled /review-pr.
# Posts confirmed findings as inline review comments (GitHub review API).
# Separate from anomalyco/opencode/github (slash commands in opencode.yml).
#
# Requires OpenCode GitHub App (OIDC) + OPENCODE_API_KEY.
# Fork PRs from public repos do not receive secrets (review skipped/fails).
# Bot-authored PRs are skipped to avoid review loops.

name: OpenCode PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  review:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: dceoy/opencode-action/.github/workflows/opencode-review.yml@0ff64486494c3134c46df6ce0e51eda4a64e349f # v0.7.3
    with:
      model: opencode/big-pickle
      prompt: /review-pr
      use-bundled-toolkit: true
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
