name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/deploy.ts"
      - "scripts/seed-config.ts"
      - "scripts/lib/**"
      - "config.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hskksk/gh-actions/setup-mise@v1

      - run: pnpm install

      - run: pnpm typecheck

      - name: Require Supabase secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=(SUPABASE_ACCESS_TOKEN)
          [ -z "${SUPABASE_PROJECT_REF:-}" ] && missing+=(SUPABASE_PROJECT_REF)
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=(SUPABASE_DB_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets for Supabase: ${missing[*]}"
            exit 1
          fi

      - name: Create .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Deploy
        run: pnpm run deploy
