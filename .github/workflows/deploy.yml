name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/deploy.ts"
      - "scripts/seed-config.ts"
      - "scripts/pipeline-cutover.ts"
      - "scripts/lib/**"
      - "config.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install

      - name: Checkout knowledge corpus
        env:
          KNOWLEDGE_GITHUB_TOKEN: ${{ secrets.KNOWLEDGE_GITHUB_TOKEN }}
        run: pnpm knowledge:checkout

      - run: pnpm typecheck

      - uses: hskksk/gh-actions/actions/setup-supabase-cli@v1
        with:
          install: "false"

      - name: Deploy
        run: pnpm run deploy
