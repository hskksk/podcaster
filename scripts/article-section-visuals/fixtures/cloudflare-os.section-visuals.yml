version: 1
sourceSha256: "39a0650aeaaebd7bab3894ea7d8c1c81423c9c42ead839c917998516d7c64e5b"
visuals:
  - sectionId: "主要サービスを四つの束ね方で見る"
    engine: article-visual
    engineVersion: "1"
    alt: "Cloudflareは配信・防御、社内アクセス、Workers、Containersの四束で1つのネットワーク契約にまとめる。"
    spec:
      type: cards
      title: 売るのは、1枚のネットワーク
      items:
        - label: 配信・防御
          detail: CDN / WAF
        - label: 社内アクセス
          detail: Zero Trust
        - label: アプリ実行
          detail: Workers
        - label: コンテナ
          detail: Containers
          emphasis: true

  - sectionId: "何を解決しようとしているか"
    engine: article-visual
    engineVersion: "1"
    alt: "バラバラなChatGPT利用、MCPへのキー散在、見えない権限の三課題を、社内向けワークスペース配布でまとめる。"
    spec:
      type: flow
      title: 三つの乱れを、ひとつに
      nodes:
        - id: chatgpt
          label: バラバラ利用
        - id: mcp
          label: キー散在
        - id: blind
          label: 見えない権限
        - id: workspace
          label: ワークスペース
          emphasis: true
      edges:
        - from: chatgpt
          to: workspace
        - from: mcp
          to: workspace
        - from: blind
          to: workspace

  - sectionId: "主要コンポーネント"
    engine: article-visual
    engineVersion: "1"
    alt: "社員の操作はWorkspaceへ送られ、Gatekeeperが許可を照会して短命な能力だけを返す。"
    spec:
      type: interaction
      title: 権限ゼロから始まる
      actors:
        - id: employee
          label: 社員
        - id: workspace
          label: Workspace
        - id: gatekeeper
          label: Gatekeeper
      steps:
        - from: employee
          to: workspace
          label: 操作を送る
        - from: workspace
          to: gatekeeper
          label: 許可を照会
        - from: gatekeeper
          to: workspace
          label: 能力を返す

  - sectionId: "cloudflare-osの中身"
    engine: article-visual
    engineVersion: "1"
    alt: "Cloudflare OSはWorkspace・Gadget・Gatekeeperを束ね、AI Gatewayで推論を一本化する。"
    spec:
      type: hierarchy
      title: OSは3本柱で束ねる
      root:
        label: Cloudflare OS
        children:
          - label: Workspace
            children:
              - label: Skills
          - label: Gadget
            children:
              - label: 社内アプリ
          - label: Gatekeeper
            emphasis: true
            children:
              - label: 外部接続

  - sectionId: "セットアップと制約"
    engine: article-visual
    engineVersion: "1"
    alt: "OSSとスターターを取得しCloudflareアカウントに載せる。Workers Paidが前提で、自サーバー本番は未提供。"
    spec:
      type: sequence
      title: 導入は4ステップ
      mode: steps
      items:
        - label: 取得
        - label: 載せる
        - label: Paid前提
          emphasis: true
        - label: 自前本番なし

  - sectionId: "評判とコミュニティの反応"
    engine: article-visual
    engineVersion: "1"
    alt: "同じ観点で見ると、称賛はGatekeeper・Gadget・AI Gatewayに、懸念は移植性・OS名称・導入摩擦に集まる。"
    spec:
      type: comparison
      title: 称賛と懸念、二極化
      sides:
        - label: 称賛
        - label: 懸念
          emphasis: true
      rows:
        - axis: 基盤設計
          cells:
            - label: Gatekeeper
            - label: 移植性
        - axis: 製品像
          cells:
            - label: Gadget
            - label: 「OS」名称
        - axis: 導入・運用
          cells:
            - label: AI Gateway
            - label: デプロイの壁

  - sectionId: "類似サービスとの比較軸"
    engine: article-visual
    engineVersion: "1"
    alt: "Cloudflare OSは自社アカウント載せ型で社員ワークスペース寄り。Copilot StudioはSaaS、DifyはワークフローOSS。"
    spec:
      type: matrix
      title: 自前 × 仕事場 で見ると
      xAxis:
        low: SaaS
        high: 自前載せ
      yAxis:
        low: ワークフロー
        high: 社員ワークスペース
      items:
        - label: Cloudflare OS
          quadrant: high-high
          emphasis: true
        - label: Copilot Studio
          quadrant: low-high
        - label: Dify
          quadrant: high-low

  - sectionId: "workers-paid多くのosデプロイの前提"
    engine: article-visual
    engineVersion: "1"
    alt: "Workers Paidは月5ドルの基本料があり、Freeの0ドルと比べリクエスト枠が大きい。"
    spec:
      type: chart
      title: まず、月5ドルから
      variant: bar
      unit: ドル
      values:
        - label: Workers Free
          value: 0
        - label: Workers Paid
          value: 5
          emphasis: true
