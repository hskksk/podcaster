          emphasis: true
        - label: 占領期間
          detail: 約27年
        - label: 非核三原則
          detail: 持込不・保有不・製造不

  - sectionId: "田中角栄と日中国交正常化1972年-電撃外交"
    engine: article-visual
    engineVersion: "1"
    alt: "1972年田中首相が北京訪問し日中国交正常化。日米協調を保ちながら中国とも関係を開いた。"
