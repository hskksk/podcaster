  - sectionId: "固定相場制と変動相場制"
    engine: article-visual
    engineVersion: "1"
    alt: "ブレトンウッズ体制下は1ドル360円の固定相場が続き、1971年ニクソンショック後は為替が変動相場へ移った。"
    spec:
      type: comparison
      title: ニクソンが固定を崩した
      sides:
        - label: 固定相場
        - label: 変動相場
      rows:
        - axis: 円ドル
          cells:
            - label: 360円固定
            - label: 市場で決まる
              emphasis: true
        - axis: きっかけ
          cells:
            - label: ブレトンウッズ
            - label: ニクソンショック

  - sectionId: "ニクソンショック1971年-揺れる国際通貨体制"
    engine: article-visual
    engineVersion: "1"
    alt: "1971年8月ニクソン大統領が金ドル兌換停止と輸入附加税を宣言し、固定相場の時代が終わった。"
    spec:
      type: sequence
      title: "1971年8月に体制が転換"
      mode: timeline
      items:
        - label: 金ドル停止
          detail: 兌換を中断
          emphasis: true
        - label: 附加税
          detail: 輸入10%など
        - label: 円フロート
          detail: 変動相場へ

  - sectionId: "沖縄返還1972年5月15日-27年ぶりの復帰"
    engine: article-visual
    engineVersion: "1"
    alt: "沖縄は1972年5月15日に日本へ返還。核兵器の持ち込みを非核三原則の下で禁止した。"
    spec:
      type: cards
      title: 返還は非核の条件付き
      items:
