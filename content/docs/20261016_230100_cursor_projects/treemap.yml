nodes:
  i2:
    title: "コーディネーターと実装群"
    subtitle: "2026年9月ベータの Projects は、コーディネーターと実装エージェントの群れで長期作業を回す Cloud Agents 製品[1][2]。"
  s13:
    subtitle: "2026年2月ブログで役割の変化を説明。クラウドエージェントは VM でビルド・テストし PR を返す。Projects は長寿命作業単位と Subscriptions でトリガーを増やす[1][2][8][10]。"
  s14:
    subtitle: "[表] コーディネーターは計画・起動・取りまとめ（メインチャット・要約対象）、実装はコード変更等（ブリーフ＋共有のみ）。巨大 diff の蓄積は抑えやすい[3]。"
  s15:
    subtitle: "Premium 以上等の Cloud Agents プランで利用。専用クラウドマシンで PC を閉じても継続。GitHub クローンと .cursor/rules・AGENTS.md がワークスペース側コンテキスト[2][11]。"
  s17:
    title: "層1: メインチャット"
    subtitle: "1 Project にメインチャット1本。上限接近で自動要約、/summarize・/compact も可。細かい決定は共有ファイルへ退避し重い作業を委譲[3][4]。"
  s18:
    title: "層2: 共有コンテキスト"
    subtitle: "クラウド同期の Project ファイル群で要約の外。単調増加しうるためコストはストアと再読へ。ノートとリポジトリは別ツリーで UI 切り替えに癖[1][2][3][12][13]。"
  s19:
    title: "層3: フレッシュ窓"
    subtitle: "全チャット履歴は非引き継ぎ。タスクブリーフと共有コンテキストのみ。Subagents 同型。兄弟間の直接通信なし、コーディネーターがハブ[3][5][7][14]。"
  s20:
    title: "リポジトリ永続コンテキスト"
    subtitle: "Rules・AGENTS.md・Memories・コードベース検索が各ターンを構成。Projects はその上に作業単位ノート層。alwaysApply ルールは毎ターン固定コスト[11][15]。"
  s22:
    title: "ハーネス層の最適化"
    subtitle: "2026年9月ブログ: システムプロンプトとツール定義が支配的。[表] 整理・動的ツール・キャッシュ等で静的トークンを大幅削減。各実装エージェントの各ターンにも適用[6]。"
  s32:
    subtitle: "クラウドエージェントは .cursor/hooks.json を実行可能。preCompact は要約直前の観測用で停止は不可だが、運用ログや監視のトリガーに使える[16]。"
  s34:
    title: "フィーチャー開発パターン"
    subtitle: "調査結果を共有コンテキストに書き、計画後に実装・テストを並列化。ノートに理解が蓄積するが、ブリーフが薄いと再調査が起きる[1][3]。"
  s35:
    title: "マイグレーションパターン"
    subtitle: "安全な手順を共有コンテキストに固定し、コーディネーターが PR を細かく増やす。レビュー減で自動化が進むと 1 PR あたりの起動回数がコスト要因[1]。"
  s36:
    title: "ガーデニング（Subscriptions）"
    subtitle: "新規 PR や Slack のバグ報告でエージェントが起動[1][2]。過去の lint やデザイン決定はノートに残るが、毎イベント起動は固定費になる。"
  ch43:
    subtitle: "要約付きチャット・同期共有ノート・フレッシュ窓の実装エージェントの組み合わせ。並列課金と重複読みが主要リスク、タスク粒度と Project ルールが防御線[7]。"
