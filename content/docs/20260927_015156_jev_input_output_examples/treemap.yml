    subtitle: 目的は「Jevに何を預け、何をコードに残すか」を機能の説明ではなく、実例の集まりで掴めるようにすることだ。公開から2週間程度の新モデルで、日本語の実測は数十件規模のものが多い。挙げる数字は、その範囲での実測値として読む。
