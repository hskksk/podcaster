            children:
              - label: フロントマター
              - label: プレイブック本文
          - label: examples
          - label: scripts

  - sectionId: "subagentサブエージェント詳解"
    engine: article-visual
    engineVersion: "1"
    alt: "サブエージェントは独立コンテキストで探索しサマリーだけ親に返す。"
    spec:
      type: comparison
      title: 主会話を汚さない委任
      sides:
        - label: メインセッション
