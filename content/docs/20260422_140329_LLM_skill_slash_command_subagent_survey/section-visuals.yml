        - label: ピア通信
          detail: 中央統制なし
        - label: 実験段階
          detail: Opus 4.6で公開
          emphasis: true

  - sectionId: "hooksフック詳解"
    engine: article-visual
    engineVersion: "1"
    alt: "イベントでシェル・プロンプト・エージェントを自動起動しワークフローを組み込む。"
    spec:
      type: flow
      title: イベントが自動化の起点
      nodes:
        - id: event
          label: フックイベント
        - id: handler
          label: ハンドラー
