      rows:
        - axis: コンテキスト
          cells:
            - label: 会話を保持
            - label: 独立ウィンドウ
              emphasis: true
        - axis: 大量読込
          cells:
            - label: 溢れやすい
            - label: 隔離される
        - axis: 戻り値
          cells:
            - label: —
            - label: サマリーのみ

  - sectionId: "agent-teamsエージェントチーム"
    engine: article-visual
    engineVersion: "1"
    alt: "複数のClaude Codeが独立コンテキストを持ちピアツーピアで協調する実験機能。"
    spec:
      type: cards
      title: 単一委任を超える協調
      items:
        - label: 独立インスタンス
