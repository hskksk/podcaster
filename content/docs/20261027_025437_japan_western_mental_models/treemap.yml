nodes:
  i3:
    title: "注意の平均差は課題に依存する"
    subtitle: "日本と米国の注意課題では平均差が報告されるが、その傾向は課題の種類や場面の条件に左右され、あらゆる状況に当てはまる国民性を示さない。"
  i4:
    title: "集団主義の通念は一貫しない"
    subtitle: "日米を比べた研究レビューでは、日本を集団主義、米国を個人主義とする通念を支持しない結果が多く、尺度の選び方が結論を左右する。"
  i5:
    title: "図の業務差は検証仮説である"
    subtitle: "共有図にある国別の業務スタイルは、認知実験で確かめられた結論ではない。実際の仕事で行動や判断の違いを測るための仮説として扱う。"
  p34:
    title: "国民性より課題ごとの傾向を見る"
    subtitle: "文化心理学は注意・推論・自己観の平均差を報告するが、特定課題で現れる傾向であり、日本人や欧米人全員に通じる単一の思考型ではない。"
  p35:
    title: "メンタルモデルを比較の整理語にする"
    subtitle: "本稿では何に注目し、状況をどう理解し、何を根拠に行動するかをまとめる一般語として使う。欧米を一集団とせず、比較対象を明確にする。"
  p36:
    title: "共有図は能力と国別仮説を並べる"
    subtitle: "画像は事業能力を階層に分け、日本・米国・西欧の組織設計が異なるという見立てを重ねる。認知研究と業務上の主張は分けて読む必要がある。"
  p37:
    title: "掲載図は共有ページの生成画像"
    subtitle: "ChatGPTの会話ページにあるプレビュー画像を掲載した。図中の全体最適・市場重視・ルール志向という国別ラベルには、図自体に研究出典が付いていない。"
  p38:
    title: "認知課題から経営差は導けない"
    subtitle: "図は比較を始める材料になるが、注意や認知の実験結果だけで企業の能力体系や意思決定の仕組みを説明することはできず、別途検証を要する。"
  p39:
    title: "注意・自己観・集団関係は別の尺度"
    subtitle: "文化心理学の研究は異なる心理過程を個別に測る。測定対象と課題を分けて読むことで、複数の平均差を一つの国民性モデルへ混ぜずに済む。"
  p40:
    title: "研究ごとに測定対象と限界を比べる"
    subtitle: "視覚的な注意・環境・自己観・集団関係の研究を同じ表で比べ、報告された結果と、その結果だけでは言えないことを並べている。"
  p41:
    title: "都市風景を変えると注意も動く"
    subtitle: "日本の都市風景を見せる実験では、日本人・米国人の双方が文脈情報に注意を向けやすくなった。環境経験も差を形づくる要因になりうる。"
  p42:
    title: "関係流動性は国内の差も説明する"
    subtitle: "日本と米国の自己開示差には関係を選び直す機会が関わり、日本国内でも身近な環境による違いが見られる。行動を国籍だけで説明しきれない。"
  p43:
    title: "日米比較のレビューは通念を支持しない"
    subtitle: "30件の比較研究をまとめたレビューでは、日米差が明確でない研究や、日本側がより個人主義的と出た研究があり、単純な通念は支持されなかった。"
  p44:
    title: "個人主義の意味と測定を問い直す"
    subtitle: "文化差がないのではなく、個人主義・相互協調を何で測るかが結果を左右する。多文化調査も自己観を一つの二分軸にまとめきれないと示す。"
  p45:
    title: "西欧は北米と同じ比較群ではない"
    subtitle: "英国・ドイツの参加者が文脈への注意で米国と日本の中間に位置する研究もある。地域・階層・職業・世代を無視して西欧を一括りにできない。"
  p46:
    title: "高低コンテクストの国分類は限定的"
    subtitle: "日本を高、欧米を低と分ける説明は入口になるが、国別分類の実証根拠は不安定で、研究結果も一貫しないというレビューがある。"
  p47:
    title: "発話の明示性は状況でも変わる"
    subtitle: "相手との関係・役職・緊急度・組織慣行が発話を左右する。国別ラベルは相手を決めつけず、確認すべき条件を探す仮説として使う。"
  p48:
    title: "図の国別ラベルを仮説として読む"
    subtitle: "全体最適・市場重視・ルール志向は生成図に示された見立てであり、認知心理学の実験が経営上の差を直接裏付けたわけではない。"
  p49:
    title: "国の印象を観察できる問いへ変える"
    subtitle: "業務で比較するには、図中の抽象的な国別ラベルを、意思決定・評価基準・部門間調整など実際に観察できる問いへ置き換える。"
  p50:
    title: "組織の行動を同じ軸で確かめる"
    subtitle: "統合・市場・規則という各ラベルを、関係者の制約、成果指標と裁量、判断を左右する規則など、現場で回答できる質問に直している。"
  p51:
    title: "比較対象は同じ業務と役割にそろえる"
    subtitle: "同じ仕事・役割で意思決定手順や評価基準を比べると、国別の印象から離れられる。日本にも市場重視、米国にも長期関係や厳格な規則がある。"
  p52:
    title: "参加者の偏りは結論の範囲を狭める"
    subtitle: "欧米の学生やオンライン参加者にサンプルが偏れば、国ごとの経験の幅を捉えにくい。多国比較では、誰を調べたかを結論と合わせて読む必要がある。"
  p53:
    title: "翻訳だけでは尺度の同等性を保証しない"
    subtitle: "同じ質問文でも、概念の意味や回答形式への慣れは文化で異なりうる。測定が同等か確かめないまま平均値を比べると解釈を誤る。"
  p54:
    title: "差が見えない結果にも検出力が要る"
    subtitle: "Many Labs 2の再検討は、文化差を測る尺度・比較対象・統計的検出力が不十分だと、差があっても検出できない可能性を指摘した。"
  p55:
    title: "測定・サンプル・環境を併せて読む"
    subtitle: "何を誰に測り、尺度が同じ意味で機能し、環境要因が説明にならないかを確かめる。国の傾向を個人や会社の能力に置き換えない。"
  i14:
    title: "業務課題で国別仮説を再現するか"
    subtitle: "複数国の企業で役職・業界・規模をそろえ、論点の分解・発言順・決裁時間を記録する。図にある業務上の違いが再現するか検証できる。"
  i15:
    title: "国の差と職場の差を分けて測る"
    subtitle: "同じ国の複数企業と、異なる国の同一業界を比べ、規則・評価制度・関係流動性を記録すれば、国籍以外の要因を切り分けられる。"
  i16:
    title: "尺度は各地域で同じ意味を持つか"
    subtitle: "翻訳だけでなく測定同等性を確かめ、年齢・階層・地域による個人差も調べる。平均値の差をどこまで比較できるか判断しやすくなる。"
  i18:
    title: "全体的・分析的認知の理論枠組み"
    subtitle: "Nisbettらは東アジアと西洋の思考過程を、文脈・関係を重視する全体的傾向と、対象・属性を重視する分析的傾向で整理した。"
  i19:
    title: "日本と米国の場面認識を実験で比較"
    subtitle: "水中映像と野生動物の写真を使い、日本人・米国人の場面記述や対象の記憶を比べた、注意と文脈感受性に関する実験研究。"
  i20:
    title: "都市の環境が文脈への注意に影響"
    subtitle: "日米の都市風景を分析し、画像を見せる実験を行った。日本の風景を見た両国の参加者が文脈情報に注意を向けやすくなったと報告する。"
  i22:
    title: "55文化集団で自己観の多様性を検討"
    subtitle: "33か国の成人調査を通じ、独立と相互協調を単純な二分法にせず、地域によって異なる自己観の側面を比較した国際共同研究。"
  i23:
    title: "日米の個人主義研究30件を再検討"
    subtitle: "先行する15件に20件を加えた比較研究レビュー。日米差がない結果や日本側がより個人主義的な結果があり、通念への疑問を示した。"
  i24:
    title: "集団内関係と所属意識を日米で調査"
    subtitle: "日本と米国の回答者を調査し、集団への同一視・忠誠と、成員間の関係知識や集団の均質性との結び付きが異なるかを検討した。"
  i25:
    title: "関係を選ぶ機会と自己開示を比較"
    subtitle: "日本と米国、さらに日本国内の参加者を調べ、関係の形成・解消の機会と親しい友人への自己開示がどう関連するかを検討した。"
  i26:
    title: "高低コンテクストの国別分類をレビュー"
    subtitle: "Hallの概念を使った先行研究を体系的に検討し、通例の高・低コンテクスト分類には根拠の弱さや研究結果の不一致があると論じた。"
  i27:
    title: "WEIRD地域外へ注意研究を広げる展望"
    subtitle: "東アジア・北米以外の地域研究を整理し、国際比較の不足や、環境・社会構造による認知の違いを踏まえた今後の研究課題を示す。"
  i28:
    title: "心理学研究の参加者層の偏りを指摘"
    subtitle: "行動科学の研究参加者が西洋・高学歴・工業化・富裕・民主的な社会に偏る問題を示し、心理学の一般化に必要な幅広いサンプルを論じた。"
  i29:
    title: "集団間比較に必要な測定不変性"
    subtitle: "心理尺度の構造や意味が集団間で等しいかを確かめる手順と報告慣行をまとめ、平均値や関連を比べる前の検証の重要性を説明する。"
  i30:
    title: "文化差の再現研究で検出力を再検討"
    subtitle: "Many Labs 2の文化差分析を再検討し、サンプルの偏りや文化の測り方、検出力が不十分だと差の不在を結論づけられないと指摘した。"
  more56:
    title: "国スコアの個人適用と画像の出典"
    subtitle: "国レベルの文化指標を個人や組織へ適用する危険を論じた研究と、記事に掲載した仮説図の出典を記録し、今回採用しなかった論点も説明する。"
