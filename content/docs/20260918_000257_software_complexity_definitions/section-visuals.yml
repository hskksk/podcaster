      nodes:
        - id: brooks
          label: Brooks 1986
        - id: tar
          label: Tar Pit 2006
        - id: hickey
          label: Simple Made Easy
          emphasis: true
      edges:
        - from: brooks
          to: tar
        - from: tar
          to: hickey

  - sectionId: "一緒に考える範囲の形式化"
    engine: article-visual
    engineVersion: "1"
    alt: "論点は本質と事故、状態と制御、簡単と単純、測定対象が仕様か実装か設計かで整理できる。"
    spec:
      type: matrix
      title: 何の複雑さかを先に決める
      xAxis:
        low: 回避しにくい
        high: 設計で減らせる
      yAxis:
        low: 要件側
        high: 実装側
      items:
        - label: Brooks本質
          quadrant: low-low
        - label: Tar Pit状態
          quadrant: high-high
          emphasis: true
        - label: Hickey絡み
          quadrant: high-high

  - sectionId: "計測可能な複雑さは定義が違う量を測っている"
    engine: article-visual
    engineVersion: "1"
