  - sectionId: "三人の関係"
    engine: article-visual
    engineVersion: "1"
    alt: "Brooksが本質と事故を分け、Tar Pitが状態を主因に再定義し、Hickeyが絡み合いの語彙を足す。"
    spec:
      type: flow
