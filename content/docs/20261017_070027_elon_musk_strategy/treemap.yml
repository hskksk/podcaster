nodes:
  i2:
    title: "戦略は四層の混同である"
    subtitle: "残す制約、削る手順、公開された順序、会社の境界は決める対象が違う。一つの戦略という言葉にまとめると、工場の規則とブログの宣言が同じ作業に見える。"
  i3:
    title: "読める順序は2006年だけ"
    subtitle: "資金の順番として追えるのは2006年の四行である。2023年は地球規模の費用計算で、2025年の文書には数量も期限もない。"
  i6:
    title: "買収後の週次は未確認"
    subtitle: "2026年2月の買収は、電力不足を宇宙の計算拠点へ移す制約の選び方である。統合のあと週次の仕事が揃ったかは、公開資料ではまだ閉じない。"
  s8:
    title: "2006年から2026年の公開資料"
    subtitle: "材料は四つのMaster Plan、ミッションページ、材料費の取材、伝記経由の製造手順、期限の年譜、2026年の企業結合である。私生活と株価は外す。"
  s9:
    title: "戻りの速さが対立軸になる"
    subtitle: "四層は、何を決めるかで分かれる。戻りが速い物理の問題では層が揃い、日付だけが先に出る問題では公開された順序だけが前に出る。"
  i11:
    title: "文書項目を三種類に分ける"
    subtitle: "各項目を完了、期限は外れたが定義はある、定義できない、に分けると、どの文書が順序でどの文書が方向の表明かが公開資料だけで判定できる。"
  i12:
    title: "削除が証拠捨てになる段"
    subtitle: "要求を疑ってから自動化する順序を、失敗の戻りが年単位の問題へ当てると、物理法則と部署の好みの区別がどこで崩れるかが境界になる。"
  i13:
    title: "統合は内製と同じ型か"
    subtitle: "電力不足を宇宙の計算へ移す判断が、部品を自社で作る判断の拡大なのか、資金と物語の結合なのかは、メモ全文と週次の仕事が揃ってから判定する。"
  s15:
    title: "ミッションは製品の一覧ではない"
    subtitle: "再利用は一度きりの機体費用を下げる突破口で、2006年の目的は太陽電気の経済へ移るのを早めることである。高級車はその手段だと文書が断っている。"
  s16:
    title: "物理以外の規則は勧告"
    subtitle: "伝記が伝える付則では、不変なのは物理法則だけで、それ以外は勧告である。仲間意識を危険と呼ぶ条は製造の板厚ではなく、挑戦を優先する組織の選択である。"
  s18:
    title: "類推を止めるのが第一原理"
    subtitle: "2013年の定義は、根本まで煮詰めて積み上げ、他人のやり方を少し変えて写すのを新しい仕事では止める、というものだ。電池は歴史的価格ではなく材料から積み直す。"
  i20:
    title: "要求には個人名が要る"
    subtitle: "最初の段は、すべての要求を疑うことである。法務部や安全部という部署名は答えにせず、賢い人や自分が出した要求も疑ってから、馬鹿さを減らす。"
  i23:
    title: "加速は削除のあと"
    subtitle: "サイクルを縮める段は、要求を疑い、部品と工程を消し、残ったものを単純化したあとである。消すべき工程を先に速くした時間を、本人は工場の失敗として振り返る。"
  i24:
    title: "自動化は不具合のあと"
    subtitle: "ネバダとフリーモントでは全工程を先に機械へ渡して失敗した。要求を疑い、部品を消し、不具合を出してから自動化する、という順序が第五段の中身である。"
  s25:
    title: "素材費との倍率で優先する"
    subtitle: "部品の総費用を素材費で割った比率が高いものは、設計か作り方が重いという仮説の合図になる。比率が低いことが正しい設計の証明だとは、この調査では置かない。"
  s26:
    title: "鋼は単価と温度で残った"
    subtitle: "炭素繊維は廃材込みでキログラム約200ドル、ステンレスは3ドルで、極低温で強度が上がり耐熱も高い。残った制約は軌道と再突入で、それらしい材料は落ちた。"
  s27:
    title: "トンネルの計算と運行は別"
    subtitle: "直径を縮め、掘削と補強を同時にし、出力を上げれば費用は10倍よくなる、という2017年の分解がある。2025年に確認できる運行は、短い区間を低速で走る別の話である。"
  s29:
    title: "高い車が次の開発費を払う"
    subtitle: "2006年の結びは、スポーツカー、手頃な車、さらに手頃な車、排出のない発電の順である。高い車を買う人が次の開発費を払う、という資金の制約が文章にある。"
  s30:
    title: "工場改善と60億マイルが同居"
    subtitle: "2016年の文書は、工場を版3までに5倍から10倍よくしうると書き、同時に世界の規制承認には約60億マイルが要ると書いている。短い日付と長い条件が同じ文書にある。"
  s31:
    title: "10兆ドルは地球の計算"
    subtitle: "2023年の論文は、製造投資10兆ドルと化石燃料の20年分14兆ドル、発電30テラワットと蓄電池240テラワット時を置く。次の車種の順番ではなく、地球規模で閉じるかの計算である。"
  s32:
    title: "2025年の文書に数量がない"
    subtitle: "Part IVはAIを物理世界へ持ち込み、労働と移動とエネルギーを組み直すと書く。2006年の四行や2023年の兆ドルと違い、投資額も期限も台数もこの文書には無い。"
  s34:
    title: "一つの注文のために法人を消す"
    subtitle: "屋根の太陽電池と蓄電池を一つの注文と設置にできないことが、2016年の統合理由である。似たミッション文ではなく、顧客から見た現物が法人で割れていた。"
  s35:
    title: "電力不足を軌道へ移す主張"
    subtitle: "2026年2月のメモは、地上ではAIの電力と冷却を賄えないとし、計算拠点を宇宙に置くことを結合の目的だと説明する。月と火星とモデル競争が同じ週次かは未確認である。"
  s37:
    title: "四回目の成功と別機体の契約"
    subtitle: "Falcon 1は2008年9月28日の4回目で軌道に入った。同年12月の16億ドルの貨物契約は、その機体ではなくFalcon 9とDragonについている。"
  i40:
    title: "2016年も完全自律は翌年"
    subtitle: "2016年6月には完全自律まで2年未満と言われ、10月には翌年末の大陸横断デモが目標になった。長いマイル条件を書いた同じ時期に、短い日付も置かれている。"
  s46:
    title: "二つの時計を一つの精度にしない"
    subtitle: "工学の時計は壊れた個体をデータにし、約束の時計は外れた年を翌年へ送る。聴き手が両方を戦略の精度として採点すると、鋼材の判断まで過剰な約束に見える。"
  i50:
    title: "手段はミッションを変えず捨てる"
    subtitle: "会社が生まれる条件の三つ目は、ミッションが狭いので関係のない製品を断れ、炭素繊維のようにそれらしい手段は目的を変えずに捨てられる、ということである。"
  i51:
    title: "センサー削減はマイルで判定"
    subtitle: "2016年の文書はカメラに加えレーダーとソナーを書いていた。その後の削減が要求の削除として正しいかは、約60億マイルが満たされたかで判定でき、この調査では未確認である。"
  i52:
    title: "狼少年は時計の取り違え"
    subtitle: "約束の時計を、工学の時計が終わった報告として出すと期限が空回りする。2023年に本人がFSDの狼少年だと言った記録は、この取り違えに本人が名前を付けたものである。"
  i53:
    title: "物語が週次の仕事より先"
    subtitle: "屋根と電池は、一つの注文にならない現物の不具合が統合の理由だった。2026年の電力の主張は似た形だが、月・火星と地上のモデル競争が同じラインに乗るかは報道が疑っている。"
  s55:
    title: "完了と宣言をラベルで分ける"
    subtitle: "完了はRoadsterからModel 3とModel Yまでの順、定義のある未達は10倍の安全や60億マイル、定義できないのは2025年の跳躍のように反証する観測が無い文である。"
  s56:
    title: "公道には危害を出さない段"
    subtitle: "工場の第五段は、不具合を出してから機械へ渡すことだった。公道では不具合自体が危害になりうるので、その前に危害を出さず不具合を見る段が要る。手順に無ければ適用範囲外である。"
  s57:
    title: "境目と現物と残差の三列"
    subtitle: "2016年の統合と2026年のメモを、消した境目、遅れていた現物、残った別目標の列で比べる。メモ全文と買収後の週次レビューが公開されるまで、第三の問いは閉じない。"
  i59:
    title: "2006年の四行の原文"
    subtitle: "Teslaのブログ。スポーツカーから手頃な車へ進み、その間に排出のない発電を用意する、という四行と、高い車の購入が次の開発費になるという説明の一次出典である。"
  i60:
    title: "2016年の工場と自律の原文"
    subtitle: "Part Deux。工場を機械を作る機械と呼び、版3までの改善と、規制承認に約60億マイル、手動の10倍の安全、不使用時の収入を同じ文書に置いた一次出典である。"
  i61:
    title: "再エネ移行の計算論文"
    subtitle: "Master Plan Part 3。製造投資10兆ドル、化石燃料の20年分14兆ドル、発電30テラワット、蓄電池240テラワット時という地球規模の実現可能性の計算である。"
  i62:
    title: "数量のない2025年の宣言"
    subtitle: "Master Plan Part IV。持続可能な豊かさと、労働・移動・エネルギーを自律と製造で組み直す方向は書かれるが、投資額も期限も台数も置かない一次ページである。"
  i63:
    title: "第一原理を定義した対談"
    subtitle: "2013年のTED。根本の真理まで煮詰め、そこから積み上げる。類推は日常には足りるが、新しいことをするときは物理学のやり方に切り替える、という定義の記録である。"
  i65:
    title: "再利用で費用を下げる方針"
    subtitle: "SpaceXの公開ページ。費用の大半は一度だけ飛ぶ機体を作ることにあり、繰り返し飛べる機体が宇宙へ出る費用を大きく下げる、というミッション側の制約の出典である。"
  i66:
    title: "貨物契約は16億ドル"
    subtitle: "NASA監察官の報告書。2008年の商業補給はSpaceXへ16億ドル、12便の固定価格で、開発中のFalcon 9とDragonに対する契約だと確認できる。"
  i67:
    title: "軌道到達と契約の同日発表"
    subtitle: "2008年12月23日の会社発表。Falcon 1が9月28日に軌道へ入ったことと、国際宇宙ステーション向け貨物契約の額を同じリリースが伝えている。"
  i68:
    title: "自動運転の期限の年譜"
    subtitle: "2025年5月の検証記事。完全自律の日付が翌年へ送り続けられた列、短いLoopの運行、狼少年という本人の言を年順に並べた反対側の記録である。"
  i69:
    title: "宇宙計算拠点の買収メモ"
    subtitle: "2026年2月2日のTechCrunch。地上では電力と冷却が足りないというメモ、合計評価の伝聞、燃焼率、月・火星とモデル競争のずれを同じ記事が伝えている。"
  i70:
    title: "評価額は関係者の話"
    subtitle: "同日のReuters。SpaceXを1兆ドル、xAIを2500億ドルとする数字は関係者の話として報じられたもので、統合の手順そのものを説明する文書ではない。"
  i71:
    title: "工場は機械を作る機械"
    subtitle: "2016年7月の工場見学の記録。工場は製品であり、そこへ充てた1時間は完成車へ充てた1時間より数倍進む、という本人の説明と、200秒が1秒になった例がある。"
  more86:
    title: "伝記の五段階と電池の例"
    subtitle: "残る六件は、自動化を先にした失敗と五段階、1割戻す規則、素材費との倍率、2017年のトンネル分解、信念の六問い、電池を材料から積み直す再話である。"
  i79:
    title: "Hyperloopは根拠にしない"
    subtitle: "試験速度と高速鉄道への反発は検証記事が触れるが、発言と運行の対はトンネルのほうが揃う。高速鉄道を止める意図は伝記の一節に依存するので本文の根拠から外した。"
  i80:
    title: "脳の帯域は臨床資料待ち"
    subtitle: "人と人の通信を千倍にする話と、機械が脳を読む速度は別だという整理がある。製造手順の地図に載せるには電極の話より先に、臨床の一次資料が要る。"
  i81:
    title: "2026年秋の台数は未確認"
    subtitle: "Cybercabの運行台数やStarshipの次回飛行は検索に見えたが、規制当局の文書と突き合わせていない。本文の年譜は2025年5月の検証記事で止めている。"
  i82:
    title: "比率は正しさの証明ではない"
    subtitle: "材料を安くすると比率はむしろ上がり、加工が価値のほぼ全部の部品では誤った優先順位になる、という指摘がある。本文は削除の合図だという限界だけを残した。"
  i83:
    title: "日本語誌は数値の根拠にしない"
    subtitle: "第一原理の三段や買収時の戦略論は検索で見つかった。数が重なる箇所は全文を確認した英文を採用し、ペイウォールの記事は数値の根拠にしなかった。"
  i84:
    title: "戦略書の定義は未検証"
    subtitle: "どこで戦いどう勝つか、との対比は調査の整理として本文にある。特定の戦略書の定義と一句ずつ照合する作業は、今回の出典には含めていない。"
  i85:
    title: "政府の削減は範囲外"
    subtitle: "要求を消せという手順を政治へ持ち出したように見える動きはある。公開された製造文書とは証拠の種類が違うので、今回の四層の地図には入れていない。"
