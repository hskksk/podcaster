          emphasis: true
        - label: 財政再建
          detail: 赤字縮小

  - sectionId: "日米貿易摩擦-ジャパンバッシング"
    engine: article-visual
    engineVersion: "1"
    alt: "半導体・自動車を巡り日米摩擦が激化し、指名買い・ローカル買いを求めるジャパンバッシングが起きた。"
