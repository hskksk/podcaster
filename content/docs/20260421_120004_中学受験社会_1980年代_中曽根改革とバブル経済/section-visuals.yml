  - sectionId: "中曽根康弘内閣1982年1987年-行政改革の時代"
    engine: article-visual
    engineVersion: "1"
    alt: "中曽根内閣は行革推進と民営化、財政再建を掲げ、外相として新保守、後に総理として強いリーダーシップを発揮した。"
    spec:
