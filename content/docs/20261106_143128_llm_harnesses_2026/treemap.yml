version: 1
sourceSha256: "b00fadb4eb0a6a89b0bc728cd073a2e684f485d1b4e744b9c0994804aa8123d9"
nodes:
  i2:
    title: "実行基盤が主戦場へ移る"
    subtitle: "指示の工夫だけでなく、ツール・状態・権限・検証を整える設計がモデルの出力を実作業へつなぎ、失敗を抑える技術課題になった。"
  i3:
    title: "評価役がアプリを実際に試す"
    subtitle: "Anthropicは計画・生成・評価を分けて実アプリを試す構成を報告した。機能の動作を確かめた一方、実行時間と費用は大きく増えた。"
  i4:
    title: "Codexの共通基盤がAPIになる"
    subtitle: "CLI・IDE・デスクトップアプリが同じハーネスを使い、さらにセッション管理や復旧を任せるマネージドAPIへと提供範囲が広がった。"
  i8:
    title: "長時間作業の費用対効果"
    subtitle: "計画・サブエージェント・コンテキスト圧縮は長い仕事を続けやすくする一方、追加のモデル呼び出しや状態の引き継ぎに費用がかかる。"
  i9:
    title: "完了確認に必要な検証方法"
    subtitle: "テストが通っても要求機能や根拠が抜ける場合がある。コード検査に加え、成果物を受け入れ条件と照合する方法が必要になる。"
  i10:
    title: "モデルが変わっても通用するか"
    subtitle: "同じハーネスでもモデルや課題が違うと順位が変わる。観測された性能が別のモデルや仕事にも一般化するかは、まだ分かっていない。"
  p30:
    title: "モデルとハーネスの役割"
    subtitle: "モデルは次の文章や行動を選び、ハーネスは実行・結果の返却・情報選択・権限管理・停止判断を担う。両者の仕事は異なる。"
  p31:
    title: "七つの設計領域で捉える"
    subtitle: "ソースコード比較研究は11システムを、ループ・モデル接続・ツール・コンテキスト・安全制御・委譲・拡張性の七領域に分類した。"
  p32:
    title: "図：行動と検証の循環"
    subtitle: "依頼からツールを実行し、環境の変化を観測して成果を検証する。未完了ならモデルへ戻り、次の行動を決める流れを示す。"
  p33:
    title: "観測が次の行動につながる"
    subtitle: "ツールの数ではなく、実行結果を作業状態へ反映し、次の判断と完了確認に活かせるかがエージェントの実務能力を左右する。"
  s13:
    title: "計画・生成・評価を分担する"
    subtitle: "計画役が仕様を作り、生成役が実装し、別の評価役がブラウザーを操作してAPIやデータベースの状態まで確認し、修正点を返す。"
  s14:
    title: "Codexの実行を複数画面で共有"
    subtitle: "App Serverはスレッド・実行イベント・承認のやり取りを共通化し、Agents APIはCodexのハーネス運用をマネージドサービスとして提供する。"
  s15:
    title: "OpenHandsとPiの設計差"
    subtitle: "OpenHandsは実行・SDK・UIを分け、Piは小さな既定機能を拡張する。Piは実行権限を標準で制限しないため、別途隔離が必要になる。"
  s17:
    title: "現実の作業では組み合わせが効く"
    subtitle: "Harness-Benchは実務に似た成果物を要件別に採点し、モデルによって最良のハーネスが違うこと、平均点と完遂率も異なることを示した。"
  s19:
    title: "比較研究は違う問いを測る"
    subtitle: "実務タスクの完遂率とコード修正ベンチマークの再実行差は別の問いを測る。目的の仕事・モデル・完了条件をそろえた比較が要る。"
  s21:
    title: "履歴を積むだけでは足りない"
    subtitle: "履歴やツール出力を積み上げるだけでは古い情報が判断を邪魔する。要約・外部メモリ・検索を使い、必要な情報を選んで渡す。"
  s22:
    title: "権限と検証は実行規則にする"
    subtitle: "危険な操作を避ける指示だけに頼らず、隔離・承認・監査を実装する。コード検査に加え、受け入れ条件に沿って成果物を確かめる。"
  s23:
    title: "製品の前提は更新される"
    subtitle: "Gemini CLIの案内は利用条件やモデル対応が変わる実例である。過去の機能表を信じず、最新の公式資料と利用設定を確認する。"
  p34:
    title: "ハーネスはモデルに合わせて組む"
    subtitle: "作業分割・状態保持・検証・権限・費用の設計を、モデルの能力と仕事の性質に合わせる。機能を増やすだけでは性能は上がらない。"
  p35:
    title: "同じ仕事で費用と完遂率を測る"
    subtitle: "一貫した勝者はいない。目的の仕事とモデルをそろえ、全要件の充足・実行時間・トークン費用・停止理由を併せて比較する。"
  i27:
    title: "企業発表は実験条件も読む"
    subtitle: "OpenAIの社内開発報告は環境づくりの実例だが、自己報告であり独立試験ではない。行数やPR数を一般的な生産性の証拠にしない。"
  i28:
    title: "旧版の値を現行値にしない"
    subtitle: "Harness-Benchは旧版から課題数や実験条件が更新された。2026年10月のv2論文を数値根拠にし、以前の二次紹介を混ぜない。"
  i29:
    title: "設計比較は性能順位ではない"
    subtitle: "11システムをソースコードから比べた研究は設計の地図を与えるが、タスク成功率や費用を測った性能ランキングではない。"
