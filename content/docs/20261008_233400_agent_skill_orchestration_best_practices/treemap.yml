  i3:
    title: 説明文は発見条件
    subtitle: description は対象と非対象の境界を書き、実プロンプトで誤起動・起動漏れを測る。
  i4:
    title: 依存グラフで連携
    subtitle: 必要なスキルだけ選び、入出力と検証から依存を組み、独立段階だけ並列化する。
  i5:
    title: 同課題で段階比較
    subtitle: スキルなし・単体・複数・構造化連携を同課題で比べ、誤選択・トークン・時間も記録する。
  s7:
    title: 直列・分岐・並列・評価ループを使い分ける
    subtitle: スキルを組み合わせる場合も、まず仕事の依存関係からパターンを選ぶ。[表] 形向く状況注意点直列後段が前段の結果を必要とする（調査 → 執筆 → 検証）早い…
  i11:
    title: 1つのスキルを一貫した仕事の単位にする
    subtitle: 1つのスキルを一貫した仕事の単位にする：特定の場合だけ必要な仕様・例・テンプレートは references/ や assets/ に置き、どの条件で読むか…
  s14:
    title: 合成しやすいスキルの作り方
    subtitle: 多くのエージェントは最初に説明文だけを見て本文を読むか判断するため、これは単なる紹介文ではなく検索・ルーティング用のインターフェースである [1][10]…
  s15:
    title: 手順の具体度を失敗コストに合わせる
    subtitle: 順序を誤るとデータを壊すなど、操作が壊れやすい場合は、正確なコマンド・順序・確認ゲートを指定する [1]。どちらの場合も「これをする」だけでなく、判断の理…
  s24:
    title: 複数スキルを連携させる
    subtitle: サブエージェントは別の指示・ツール範囲を持つ独立した作業者として委譲する仕組みで、必要に応じて並列調査やコンテキストの分離に使う。コード化されたワークフロ…
  s25:
    title: 過剰な合成が得とは限らない
    subtitle: また、2〜3個の焦点を絞ったスキルは包括的な説明より有利だったと報告する [7]。これは全タスクで「2〜3個」が最適という意味ではない。
