  i3:
    title: SKILL.md の短い説明文は発見条件であり…
    subtitle: SKILL.md の短い説明文は発見条件であり、対象タスクと対象外の近接タスクを分けて書き、実際のプロンプトで誤起動と起動漏れを測る。
  i4:
    title: 複数スキルを使うなら、必要なものだけを選び、各…
    subtitle: 複数スキルを使うなら、必要なものだけを選び、各段階の入力・出力・検証条件から依存グラフを組み、依存しない段階だけ並列化する。
  i5:
    title: 評価はスキルなし・単体・複数のフラットな利用・…
    subtitle: 評価はスキルなし・単体・複数のフラットな利用・構造化した連携を同じ課題で比べ、品質だけでなく誤選択・トークン・時間も記録する。
  s7:
    title: Anthropic は、固定された段階をつなぐ…
    subtitle: スキルを組み合わせる場合も、まず仕事の依存関係からパターンを選ぶ。[表] 形向く状況注意点直列後段が前段の結果を必要とする（調査 → 執筆 → 検証）早い段階の誤りが後続へ伝わるため、受け渡し前に検査する条件分岐タスク…
  i11:
    title: 特定の場合だけ必要な仕様・例・テンプレートは …
    subtitle: 特定の場合だけ必要な仕様・例・テンプレートは references/ や assets/ に置き、どの条件で読むかを本文から直接指定する。
  s14:
    title: 仕様上、name と description …
    subtitle: 多くのエージェントは最初に説明文だけを見て本文を読むか判断するため、これは単なる紹介文ではなく検索・ルーティング用のインターフェースである [1][10]。説明文には具体的なユーザー意図や対象ファイル・用語を入れ、隣接…
  s15:
    title: 複数の方法が許容され、文脈に応じた判断が必要な…
    subtitle: 順序を誤るとデータを壊すなど、操作が壊れやすい場合は、正確なコマンド・順序・確認ゲートを指定する [1]。どちらの場合も「これをする」だけでなく、判断の理由を伝えると、想定外の入力に応じて適用しやすい。よい手順には、該…
  s24:
    title: スキルは専門的な手順を現在のエージェントに与え…
    subtitle: サブエージェントは別の指示・ツール範囲を持つ独立した作業者として委譲する仕組みで、必要に応じて並列調査やコンテキストの分離に使う。コード化されたワークフローは順序や合否判定を決定的にする。OpenCode では ski…
  s25:
    title: SkillsBench は86課題・11領域・…
