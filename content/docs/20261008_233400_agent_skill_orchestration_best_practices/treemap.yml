  i3:
    title: 説明文は発見条件
    subtitle: SKILL.md の description は対象タスクと非対象の境界を書き、実プロンプトで誤起動・起動漏れを測る。
  i4:
    title: 依存グラフで連携
    subtitle: 必要なスキルだけ選び、入出力と検証条件から依存を組み、独立段階だけ並列化する。
  i5:
    title: 同課題で段階比較
    subtitle: スキルなし・単体・複数・構造化連携を同じ課題で比べ、品質に加え誤選択・トークン・時間も記録する。
  s7:
    title: 直列・分岐・並列・評価ループを使い分ける
    subtitle: Anthropic は、固定された段階をつなぐ連鎖、入力に応じた振り分け、独立作業の並列化、中央役が下位作業を分解する方式、評価と修正を繰り返す方式を別々…
  i11:
    title: 特定の場合だけ必要な仕様・例・テンプレ…
    subtitle: 特定の場合だけ必要な仕様・例・テンプレートは references/ や assets/ に置き、どの条件で読むかを本文から直接指定する。
  s14:
    title: 説明文をスキル選択のインターフェースとして…
    subtitle: 仕様上、name と description は必須であり、説明文には何を行うかと、いつ使うかを含める [2]。多くのエージェントは最初に説明文だけを見て…
  s15:
    title: 手順の具体度を失敗コストに合わせる
    subtitle: 複数の方法が許容され、文脈に応じた判断が必要なら、目的や判断材料を示してエージェントに選択の余地を残す。順序を誤るとデータを壊すなど、操作が壊れやすい場合…
  s24:
