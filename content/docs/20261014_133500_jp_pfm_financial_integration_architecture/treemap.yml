    subtitle: 主要プレイヤーごとの位置づけ：マネーフォワード公式 note では、2018 年銀行法改正後に銀行口座は可能な限り API、スクレイピング継続には契約が必…
  p84:
    title: データ同期・正規化・運用
    subtitle: データ同期・正規化・運用：接続層が金融機関から生データを受け取った後の処理も、アーキテクチャの一部である。
  p85:
    title: データ同期・正規化・運用
    subtitle: 遅れて連携すると過去明細が取り残される。
  p86:
    title: データ同期・正規化・運用
    subtitle: 公開資料で実装名は確認できない。
  p87:
    title: データ同期・正規化・運用
    subtitle: PFM はカテゴリマスタとルールエンジンをアプリ層に置く。
  p88:
    title: データ同期・正規化・運用
    subtitle: 障害時は口座状態を error / auth_required のように表面化し、サポート FAQ と一致させる。
  p89:
    title: 規制と契約がインフラ形を決める
    subtitle: 銀行法上の電子決済等代行業登録、金融機関との API 利用契約、再委託の連鎖接続通知が、どのコネクタを本番に載せられるかを決める[4][27]。
  p90:
    title: 規制と契約がインフラ形を決める
    subtitle: 三井住友信託銀行の公表契約例では、再委託先への情報提供時に同等の安全管理義務と金融機関の停止権が明記される[28]。
  p91:
    title: 規制と契約がインフラ形を決める
    subtitle: これは、PFM が接続を外部 SaaS に丸ごと委ねるときのサプライチェーンリスクとして設計レビューに入れるべき項目である。
  ch19:
    title: グローバルとの対比（参考）
    subtitle: 銀行側ネットワーク（Akoya など）は credential を共有しない API 100% を掲げる動きもある[30]。日本は全銀フォーマットベースの…
  i21:
    title: 次に解くべき3つの問い
    subtitle: 全銀協の電文仕様は目安に留まり、銀行ごとの拡張が残るため[10]、アダプタ削減の経済性は銀行単位の保守コスト試算が要る。
  i22:
    title: 次に解くべき3つの問い
    subtitle: 人手再取得を前提にするか、利用者へのプッシュ通知で都度認証させるかで、接続層の状態機械と UX が変わる[16]。
  i23:
    title: 次に解くべき3つの問い
    subtitle: 契約・再委託・データ二次利用条項の違いが、マルチテナント SaaS のコンプライアンス境界を決める[4][21]。
