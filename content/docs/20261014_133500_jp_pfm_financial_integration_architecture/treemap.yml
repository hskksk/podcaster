nodes:
  i2:
    title: 日本の Zaim・マネーフォワード ME など…
    subtitle: 日本の Zaim・マネーフォワード ME などは、口座明細を集める「接続層」と、家計簿用に正規化する「アプリ層」を分け、接続層では公式 API とスクレイピング（画面代行取得）を金融機関ごとに併用する。
  i3:
    title: 銀行向け API 連携は OAuth 2.0 …
    subtitle: 銀行向け API 連携は OAuth 2.0 系の認可で銀行発行トークンを使うため、PFM 側はログインパスワードを預からず、トークン更新と再認可の運用がアーキテクチャの中心になる。
  i4:
    title: スクレイピング連携は暗号化した認証情報とブラウ…
    subtitle: スクレイピング連携は暗号化した認証情報とブラウザ自動化で Web 明細を読む方式で、UI 変更・追加認証・取得不可期間への耐性が設計の難所になる。
  i5:
    title: Moneytree LINK や MoneyL…
    subtitle: Moneytree LINK や MoneyLook のように、接続を B2B で束ねるアグリゲータを挟む構成では、PFM や会計 SaaS は単一の REST API と正規化済みスキーマだけを実装すればよい。
  i6:
    title: 2018 年改正銀行法に基づく電子決済等代行業…
    subtitle: 2018 年改正銀行法に基づく電子決済等代行業登録と金融機関との API／スクレイピング契約が、接続方式の選択肢と再委託の可否を決める法的フレームである。
  p60:
    title: 複数の銀行・カード・証券口座を一つの家計簿に載…
    subtitle: Zaim（くふう）やマネーフォワード ME は、利用者の同意のもとで各金融機関から入出金明細や残高を取り込み、カテゴリ分類やレポート用の内部データに変換する。
  p61:
    title: 本レポートは、システム間連携部分——誰がどのプ…
    subtitle: 対象は日本の消費者向け PFM（Zaim、マネーフォワード ME）と、同種の接続を B2B で提供する Moneytree LINK・MoneyLook。米欧の Plaid 型アグリゲータは比較の補助として触れる。各社…
  p62:
    title: 読者の前提は実務とする。
    subtitle: HTTP API、OAuth、バッチジョブ、暗号化保存といった語は説明せず、電子決済等代行業や日本の銀行 API の特殊性は本文で足場を置く。
  p63:
    title: 金融機関との接続は、プロトコルと認証の組み合わ…
    subtitle: 日本の PFM で実際に併用される方式を表にまとめる。
  p64:
    title: 表：方式認証の置き場所データ取得の実体主な長所…
    subtitle: '[表] 方式認証の置き場所データ取得の実体主な長所主な短所銀行オープン API（参照系）銀行の認可画面で利用者が同意；PFM はアクセストークン等のみ保持銀行が公開した HTTPS API（残高・明細）パスワード非預か…'
  p65:
    title: 銀行が公式 API を提供している場合、金融庁…
    subtitle: カード会社・証券・ポイントサイトは API 整備が遅れがちで、PFM は長期間スクレイピングとファイル取込が残る。
  p66:
    title: 消費者向け PFM の連携部分は、次の四層に分…
    subtitle: 消費者向け PFM の連携部分は、次の四層に分けて説明できる。各社の製品名は異なるが、責務の分割は似ている。
  p67:
    title: 図（mermaid）
    subtitle: '[コード:mermaid]'
  p68:
    title: クライアントは連携登録の UI を提供する。
    subtitle: API 方式ではアプリ内ブラウザやシステムブラウザで銀行の認可画面へ遷移し、利用者が銀行側でログイン・口座選択・同意を行う[2][5]。スクレイピング方式ではアプリ上で ID・パスワードを入力し、サーバへ送る[2]。
  p69:
    title: 接続層が本題である。
    subtitle: 金融機関ごとにアダプタ（コネクタ）を持ち、取得スケジュール、リトライ、レート制限、エラー分類を共通化する。マネーフォワードは取得データと銀行認証情報を別サーバに暗号化保存し、アクセスを制限していると公表している[2]。…
  p70:
    title: アプリ層は、取り込んだ明細を口座・取引エンティ…
    subtitle: Moneytree LINK はここに近い正規化を接続層の手前で行い、クライアントには /link/v1/accounts や transactions など統一 JSON を返す[8][9]。
  p71:
    title: 日本の参照系銀行 API は、OAuth 2.…
    subtitle: 全銀協の電文仕様標準は残高照会・入出金明細照会などの項目の目安を定め、銀行は協議で拡張する[10]。FISC の API 接続先チェックリストは、接続事業者のセキュリティ審査の共通言語として使われる[11]。
  p72:
    title: 典型的な参照系フローは次のとおりである。
    subtitle: 典型的な参照系フローは次のとおりである。
  p73:
    title: '[コード:mermaid]'
    subtitle: '[コード:mermaid]'
  p74:
    title: マネーフォワード ME とセブン銀行の公式連携…
    subtitle: マネーフォワード クラウドの API 連携では、アクセス許可が30 日から 100 日で失効し、再認証が必要と案内されている[13]。この失効設計は、接続層にトークンライフサイクル管理（期限監視、利用者への再認可プロン…
  p75:
    title: GMO あおぞら銀行の公開仕様書のように、スコ…
    subtitle: PFM が扱うのは参照系が中心だが、会計 SaaS や MoneyLook BIZ は更新系 API や総合振込系に触れる製品もある。
  p76:
    title: 自社で数百金融機関と契約・実装するコストを避け…
    subtitle: 自社で数百金融機関と契約・実装するコストを避けるため、PFM 以外の多くのフィンテックはアグリゲーション基盤を利用する。
  p77:
    title: Moneytree LINK は、ゲストユーザ…
    subtitle: 認可は Authorization Code + PKCE が前提で、state は必須パラメータとされる[17][18]。金融機関側の API とスクレイピングの差異を LINK 内部で吸収し、クライアントは OAu…
  p78:
    title: MoneyLook（SBI 系）は法人向けに、…
    subtitle: 「電子決済等代行業登録や個別銀行契約が不要」という売り文句は、接続責務が MoneyLook 側に集約されることを意味する[21]。
  p79:
    title: この構成の論理図は次のとおりである。
    subtitle: この構成の論理図は次のとおりである。
  p80:
    title: 図（mermaid）（2）
    subtitle: '[コード:mermaid]'
  p81:
    title: Zaim は電子決済等代行業者として金融機関と…
    subtitle: つまり Zaim 単体でも接続層を内製しているが、法的には再委託チェーンをアーキテクチャ図に描ける。
  p82:
    title: 表：観点Zaimマネーフォワード ME / ク…
    subtitle: '[表] 観点Zaimマネーフォワード ME / クラウドMoneytree LINKMoneyLook主な利用者個人家計簿個人 PF＋法人会計フィンテック開発者法人経理・業務システム接続の公開面銀行 API へ順次移行…'
  p83:
    title: マネーフォワード公式 note では、2018…
    subtitle: マネーフォワード公式 note では、2018 年銀行法改正後に銀行口座は可能な限り API、スクレイピング継続には契約が必要になったことが、接続戦略の転換点として語られている[25]。
  p84:
    title: 接続層が金融機関から生データを受け取った後の処…
    subtitle: 接続層が金融機関から生データを受け取った後の処理も、アーキテクチャの一部である。
  p85:
    title: 連携開始日や最終取得日時を口座単位で保持し、照…
    subtitle: 増分取得 — 連携開始日や最終取得日時を口座単位で保持し、照会可能期間の上限は金融機関依存とマネーフォワードが注意している[16]。遅れて連携すると過去明細が取り残される。
  p86:
    title: 同一明細の二重登録を防ぐため、金融機関側の取引…
    subtitle: 冪等な取込 — 同一明細の二重登録を防ぐため、金融機関側の取引 ID、または日付・金額・摘要のハッシュでユニーク制約を張るのが一般的である。公開資料で実装名は確認できない。
  p87:
    title: Moneytree は AI による支出仕訳で…
    subtitle: 正規化 — Moneytree は AI による支出仕訳で明細を加工すると公表している[26]。PFM はカテゴリマスタとルールエンジンをアプリ層に置く。
  p88:
    title: 個人向けは夜間バッチと手動「更新」ボタンの併用…
    subtitle: ジョブ運用 — 個人向けは夜間バッチと手動「更新」ボタンの併用が多い。障害時は口座状態を error / auth_required のように表面化し、サポート FAQ と一致させる。
  p89:
    title: 接続アーキテクチャは技術だけで完結しない。
    subtitle: 銀行法上の電子決済等代行業登録、金融機関との API 利用契約、再委託の連鎖接続通知が、どのコネクタを本番に載せられるかを決める[4][27]。
  p90:
    title: フジタ総合法律事務所の整理では、API 方式は…
    subtitle: 三井住友信託銀行の公表契約例では、再委託先への情報提供時に同等の安全管理義務と金融機関の停止権が明記される[28]。
  p91:
    title: SBI ビジネス・ソリューションズは、再委託で…
    subtitle: これは、PFM が接続を外部 SaaS に丸ごと委ねるときのサプライチェーンリスクとして設計レビューに入れるべき項目である。
  ch19:
    title: 米国では Plaid 型の commercia…
    subtitle: 銀行側ネットワーク（Akoya など）は credential を共有しない API 100% を掲げる動きもある[30]。日本は全銀フォーマットベースの銀行ごと仕様と FISC チェックリストが中心で、EU の PS…
  i21:
    title: 銀行 API の標準化が進んだとき、PFM 内…
    subtitle: 全銀協の電文仕様は目安に留まり、銀行ごとの拡張が残るため[10]、アダプタ削減の経済性は銀行単位の保守コスト試算が要る。
  i22:
    title: スクレイピング依存口座を、追加認証多発の環境で…
    subtitle: 人手再取得を前提にするか、利用者へのプッシュ通知で都度認証させるかで、接続層の状態機械と UX が変わる[16]。
  i23:
    title: B2B アグリゲータ依存と内製接続の境界を、ど…
    subtitle: 契約・再委託・データ二次利用条項の違いが、マルチテナント SaaS のコンプライアンス境界を決める[4][21]。
