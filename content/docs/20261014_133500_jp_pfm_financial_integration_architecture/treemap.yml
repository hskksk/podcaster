    subtitle: 全銀協の電文仕様標準は残高照会・入出金明細照会などの項目の目安を定め、銀行は協議で拡張する[10]。FISC の API 接続先チェックリストは、接続事業…
  p72:
    title: 銀行 API 連携のフロー
    subtitle: 銀行 API 連携のフロー：典型的な参照系フローは次のとおりである。
