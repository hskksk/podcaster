  p69:
    title: 論理アーキテクチャの全体像
    subtitle: 金融機関ごとにアダプタ（コネクタ）を持ち、取得スケジュール、リトライ、レート制限、エラー分類を共通化する。マネーフォワードは取得データと銀行認証情報を別サ…
