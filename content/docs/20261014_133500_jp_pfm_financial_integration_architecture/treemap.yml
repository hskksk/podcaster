    title: 銀行 API 連携のフロー
    subtitle: マネーフォワード クラウドの API 連携では、アクセス許可が30 日から 100 日で失効し、再認証が必要と案内されている[13]。この失効設計は、接続…
  p75:
    title: 銀行 API 連携のフロー
    subtitle: PFM が扱うのは参照系が中心だが、会計 SaaS や MoneyLook BIZ は更新系 API や総合振込系に触れる製品もある。
  p76:
    title: B2B アグリゲータを挟む構成
    subtitle: B2B アグリゲータを挟む構成：自社で数百金融機関と契約・実装するコストを避けるため、PFM 以外の多くのフィンテックはアグリゲーション基盤を利用する。
  p77:
    title: B2B アグリゲータを挟む構成
    subtitle: 認可は Authorization Code + PKCE が前提で、state は必須パラメータとされる[17][18]。金融機関側の API とスクレ…
  p78:
    title: B2B アグリゲータを挟む構成
    subtitle: 「電子決済等代行業登録や個別銀行契約が不要」という売り文句は、接続責務が MoneyLook 側に集約されることを意味する[21]。
