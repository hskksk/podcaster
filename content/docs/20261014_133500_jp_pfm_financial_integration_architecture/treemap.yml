  i2:
    title: 接続層とアプリ層
    subtitle: Zaim・MF 等は明細取得の接続層と家計簿正規化のアプリ層を分け、API とスクレイピングを併用する。
  i3:
    title: 銀行 API と OAuth
    subtitle: 銀行発行トークンで PFM はパスワードを預からず、更新と再認可の運用が要る。
  i4:
    title: スクレイピング接続
    subtitle: 暗号化資格情報とブラウザ自動化で Web 明細を読み、UI 変更と追加認証が難所になる。
  i5:
    title: B2B アグリゲータ
    subtitle: Moneytree LINK 等を挟むと PFM は単一 API で複数金融機関に届ける構成になる。
  i6:
    title: 電子決済等代行
    subtitle: 2018 改正銀行法の登録と契約が、API／スクレイピングと再委託の選択肢を決める。
  p60:
    title: PFM は接続が本体
    subtitle: 同意に基づき明細を取り込み、カテゴリ分類やレポート用データへ正規化する流れが中心。
  p61:
    title: レポートの射程
    subtitle: 対象は日本の Zaim・MF ME と Moneytree LINK・MoneyLook 等の接続方式の整理。
  p62:
    title: 概要
    subtitle: HTTP API、OAuth、バッチジョブ、暗号化保存といった語は説明せず、電子決済等代行業や日本の銀行 API の特殊性は本文で足場を置く。
  p63:
    title: 連携方式の分類軸
    subtitle: 日本の PFM で実際に併用される方式を表にまとめる。
