sourceSha256: 2ba31e25657cb5d0439d1359109d07138667e9c2ac7c03c5814230d5ca47829f
nodes:
  i2:
    title: 接続層とアプリ層を分離する
    subtitle: 日本の Zaim・マネーフォワード ME などは口座明細を集める接続層と家計簿正規化のアプリ層を分け、接続層で公式 API とスクレイピングを金融機関ごとに併用する典型形を示す。
  i3:
    title: 銀行 API はトークン運用が中心
    subtitle: 銀行向け API 連携は OAuth 2.0 系認可で銀行発行トークンを使うため PFM はログインパスワードを預からず、トークン更新と再認可の運用がアーキテクチャの要になる。
  i4:
    title: スクレイピングは耐性が難所
    subtitle: 暗号化した認証情報とブラウザ自動化で Web 明細を読む方式は、UI 変更・追加認証・取得不可期間への耐性が設計上のボトルネックとなり、接続層の状態管理が重くなる。
  i5:
    title: B2B アグリゲータで接続集約
    subtitle: Moneytree LINK や MoneyLook のように接続を B2B で束ねる構成では、PFM や会計 SaaS は単一 REST API と正規化済みスキーマだけを実装すれば足りる。
  i6:
    title: 電代業登録が方式を規律する
    subtitle: 2018 年改正銀行法に基づく電子決済等代行業登録と金融機関との API／スクレイピング契約が、接続方式の選択肢と再委託の可否を決める法的フレームである。
  p60:
    title: PFM の本体は集約処理
    subtitle: 複数口座を一つの家計簿に載せる PFM は見た目はアプリだが裏側は金融データのアグリゲーションが本体で、Zaim や MF は同意の下で明細・残高を取り込み内部データへ変換する。
  p61:
    title: 本稿は連携部分の論理像
    subtitle: 誰がどのプロトコルで金融機関と話し認証をどこに置きいつ再取得するかを整理する。公開ドキュメントと業界標準から論理アーキテクチャを再構成し非公開実装は扱わない。
  p62:
    title: 読者は実務前提とする
    subtitle: HTTP API、OAuth、バッチ、暗号化保存は説明しない。電子決済等代行業や日本の銀行 API の特殊性は本文で足場を置き、設計議論に直接入る想定の読者層を明示する。
  p63:
    title: プロトコルと認証で分類
    subtitle: 金融機関との接続はプロトコルと認証の組み合わせで分類すると設計の議論が揃う。日本の PFM で実際に併用される方式を一覧表の前提として先に示す。
  p64:
    title: 表（連携方式の四類型）
    subtitle: 銀行オープン API、スクレイピング、ファイル手動取込、B2B アグリゲータ経由を、認証の置き場所・取得の実体・長所と短所の軸で横並びに比較する方式一覧表である。
  p65:
    title: 銀行は API 接続が前提
    subtitle: 公式 API を提供する銀行では金融庁の整理によりスクレイピングのみは想定されず API が前提になる。カード・証券・ポイントは API 整備が遅くスクレイピングと手動取込が残る。
  p66:
    title: 連携は四層に分割できる
    subtitle: 消費者向け PFM の連携部分はクライアント、アプリ・ドメイン、接続・オーケストレーション、外部の四層に分けて説明できる。製品名は異なるが責務分割は各社で似ている。
  p67:
    title: 図（四層アーキテクチャ）
    subtitle: モバイル／Web から家計簿 DB と連携ジョブへ至り、ボルトと金融機関アダプタが銀行 API・Web 明細・アグリゲータ API に伸びる四層構成を flowchart で示す。
  p68:
    title: クライアントは登録 UI を担う
    subtitle: API 方式はアプリ内ブラウザで銀行認可画面へ遷移し利用者が口座選択・同意する。スクレイピング方式はアプリで ID・パスワードを入力しサーバへ送る UI 差がある。
  p69:
    title: 接続層がアダプタの要
    subtitle: 金融機関ごとにコネクタを持ち取得スケジュール・リトライ・レート制限・エラー分類を共通化する。MF は認証情報を別サーバ暗号化、Zaim は分離保管し API では ID 非保存と公表する。
  p70:
    title: アプリ層は明細をマップ
    subtitle: 取り込んだ明細を口座・取引エンティティにマッピングする層である。Moneytree LINK は手前で正規化し、クライアントへ accounts や transactions の統一 JSON を返す。
  p71:
    title: 参照系 API は OAuth 基盤
    subtitle: 日本の参照系銀行 API は OAuth 2.0 認可と銀行別エンドポイントの組み合わせが多い。全銀協電文仕様は項目の目安、FISC チェックリストは接続事業者審査の共通言語になる。
  p72:
    title: 参照系フローの導入文
    subtitle: 典型的な参照系フローを次のシーケンス図で示す直前の一文であり、以降の OAuth コード交換と定期同期の図解への入口として読者を誘導する。
  p73:
    title: 図（参照系 OAuth シーケンス）
    subtitle: 連携開始から銀行画面での同意、認可コードとトークン取得、Bearer による明細・残高照会の定期同期までを sequence 図で示す参照系 API の標準的な往復である。
  p74:
    title: トークン失効が運用を規定
    subtitle: MF とセブン銀行連携は参照系 API と OAuth 2.0 基盤が明記される。クラウド API 許可は 30〜100 日で失効し、期限監視・再認可プロンプト・リフレッシュを接続層に必須とする。
  p75:
    title: 参照系と更新系スコープ分離
    subtitle: GMO あおぞらのように private:account と corp:transfer で参照と更新が分かれる銀行もある。PFM は参照中心だが会計 SaaS や MoneyLook BIZ は振込系 API に触れる。
  p76:
    title: 内製数百接続はコスト大
    subtitle: 自社で数百金融機関と契約・実装するコストを避けるため、PFM 以外の多くのフィンテックはアグリゲーション基盤を利用し接続実装を外部製品へ寄せる選択を取る。
  p77:
    title: Moneytree LINK の役割
    subtitle: ゲストユーザー口座を継続取得し標準化 API で提供する基盤。認可は Authorization Code と PKCE、state 必須。FI 側 API とスクレイピング差を内部吸収しクライアントは OAuth と REST だけ実装する。
  p78:
    title: MoneyLook は法人向け束ね
    subtitle: SBI 系 MoneyLook は銀行 API とスクレイピング契約を束ね ERP へ API または CSV で渡す。電代業登録や個別銀行契約不要の売りは接続責務が MoneyLook 側に集約される意味である。
  p79:
    title: アグリゲータ図の導入
    subtitle: B2B アグリゲータを挟む構成の論理図を次に示す直前の一文で、以降の flowchart が自社サービスと統一 API・数百コネクタ・金融機関の関係を視覚化する。
  p80:
    title: 図（B2B アグリゲータ構成）
    subtitle: 会計 SaaS や PFM が OAuth と REST で LINK に接続し、内部コネクタが銀行 API と Web 明細へ伸びる。自社は統一 API 境界だけを実装する論理構成を示す。
  p81:
    title: Zaim の再委託チェーン
    subtitle: Zaim は電代業として API またはスクレイピング契約を公表し、再委託者への指導・契約・金融機関の停止権まで条文で示す。内製接続層でも法的に再委託チェーンを図示できる。
  p82:
    title: 表（主要四社の接続比較）
    subtitle: Zaim、マネーフォワード、Moneytree LINK、MoneyLook を主な利用者・接続の公開面・認証情報の扱い・開発者向け API の観点で横並びに整理した比較表である。
  p83:
    title: 2018 銀行法が戦略転換点
    subtitle: MF 公式 note は銀行法改正後、銀行口座は可能な限り API へ、スクレイピング継続には契約が必要になった点を接続戦略の転換点として語っている。
  p84:
    title: 取得後処理もアーキの一部
    subtitle: 接続層が金融機関から生データを受け取った後の増分・冪等・正規化・ジョブ運用もアーキテクチャの一部として扱い、家計簿表示の手前までのデータライフサイクルを完結させる。
  p85:
    title: 増分取得と照会期間上限
    subtitle: 連携開始日や最終取得日時を口座単位で保持し、照会可能期間の上限は金融機関依存と MF が注意する。遅れて連携すると過去明細が取り残される運用上のリスクがある。
  p86:
    title: 冪等取込で二重登録防止
    subtitle: 同一明細の二重登録を防ぐため金融機関側取引 ID または日付・金額・摘要のハッシュでユニーク制約を張るのが一般的である。公開資料では具体実装名は確認できない。
  p87:
    title: 正規化とカテゴリエンジン
    subtitle: Moneytree は AI 支出仕訳で明細を加工すると公表する。PFM はカテゴリマスタとルールエンジンをアプリ層に置き、接続層の生データを家計簿表示用に変換する。
  p88:
    title: ジョブ運用と口座状態表示
    subtitle: 個人向けは夜間バッチと手動更新ボタンの併用が多い。障害時は口座を error や auth_required として表面化し、サポート FAQ と UI 表示を一致させる。
  p89:
    title: 技術だけでは完結しない
    subtitle: 電代業登録、金融機関との API 利用契約、再委託の連鎖接続通知が、どのコネクタを本番に載せられるかを決める。接続アーキテクチャは法と契約と一体で設計する。
  p90:
    title: API とスクレイピングの法分類
    subtitle: フジタ法律事務所は API を銀行同意とトークン、スクレイピングを電代業者が認証を預かるレガシー認証と整理する。三井住友信託の契約例は再委託先の安全管理義務と停止権を明記する。
  p91:
    title: 再委託のサプライチェーンリスク
    subtitle: SBI ビジネス・ソリューションズは再委託 API 接続で金融機関が不適切と判断すれば停止を求められる旨を公表する。外部 SaaS に接続を委ねる際の設計レビュー項目となる。
  ch19:
    title: 米欧アグリゲータと日本の差
    subtitle: 米国では Plaid 型が OAuth とスクレイピング fallback を組み合わせ、Akoya は credential 非共有 API を掲げる。日本は全銀ベースの銀行別仕様と FISC が中心で PSD2 級の単一規格には至らない。
  i21:
    title: 内製コネクタ共通化の経済性
    subtitle: 銀行 API 標準化が進んでも全銀協電文は目安に留まり銀行ごと拡張が残る。PFM 内製コネクタをどこまで共通ライブラリに統合できるかは銀行単位の保守コスト試算が要る。
  i22:
    title: 追加認証下の自動化限界
    subtitle: スクレイピング依存口座を追加認証多発環境でどこまで自動化するか。人手再取得を前提にするかプッシュで都度認証させるかで、接続層の状態機械と UX が変わる。
  i23:
    title: アグリゲータと内製の境界
    subtitle: B2B アグリゲータ依存と内製接続の境界をどの製品フェーズで引くか。契約・再委託・データ二次利用条項の違いがマルチテナント SaaS のコンプライアンス境界を決める。
  ch24:
    title: 接続層中心の設計要点
    subtitle: 家計簿の背後にはアダプタ群・認証保管・同期オーケストレータがある。銀行は API へ移行しつつレガシー Web はスクレイピングが残り、方式ごとの認証と失効と法制度がコネクタを規律する。
  i27:
    title: 出典［2］MF データ管理 FAQ
    subtitle: マネーフォワード ME サポートが公表する金融機関データとログイン情報の保管方針。API とスクレイピングで認証情報の置き場と暗号化の扱いがどう分かれるかを示す。
  i28:
    title: 出典［3］API とスクレイピング解説
    subtitle: Moneytree LINK Blog が API 接続とスクレイピングの違いを整理した記事。金融庁整理と併せて銀行向け接続方式の前提知識として本文で参照される。
  i30:
    title: 出典［5］MF 口座登録手順
    subtitle: マネーフォワード ME サポートの金融関連サービス口座登録方法。アプリ内ブラウザで銀行認可画面へ遷移する API 連携 UI の具体手順を裏付ける公開ドキュメントである。
  i32:
    title: 出典［7］Zaim API 対応先 FAQ
    subtitle: Zaim FAQ が API 対応連携先一覧を維持する公式回答。銀行 API への順次移行と対応先リスト更新が接続層の公開面としてどう運用されるかを示す。
  i33:
    title: 出典［8］LINK 製品技術概要
    subtitle: Moneytree LINK Docs の製品・技術概要。ゲストユーザー口座の継続取得と標準化 API 提供という B2B アグリゲータ基盤の論理像を技術文書で説明する。
  i34:
    title: 出典［9］LINK API 製品ページ
    subtitle: Moneytree の LINK API 製品ページ。統一 REST と正規化データ提供、仕訳精度などクライアントが実装すべき境界の外側に何があるかを製品観点で示す。
  i35:
    title: 出典［10］全銀協電文仕様標準
    subtitle: 全国銀行協会のオープン API 電文仕様標準第 2 版 PDF。残高照会・入出金明細照会などの項目目安を定め、銀行ごと拡張が残る標準化の実態を示す。
  i36:
    title: 出典［11］FISC API チェックリスト
    subtitle: FISC の API 接続先チェックリスト 2025 年 12 月版。接続事業者のセキュリティ審査の共通言語として本文の銀行 API 連携章で参照される公式資料である。
  i37:
    title: 出典［12］MF×セブン銀行連携
    subtitle: PRTIMES のマネーフォワードとセブン銀行個人向け参照系 API 公式連携開始リリース。OAuth 2.0 準拠認証と参照系 API の実例としてトークン運用章を裏付ける。
  i38:
    title: 出典［13］MF クラウド API 期限
    subtitle: マネーフォワード クラウドサポートの API 連携メリット FAQ。アクセス許可が 30 日から 100 日で失効し再認証が必要と案内する一次情報で失効設計の根拠となる。
  more92:
    title: 出典ほか 18 件まとめ
    subtitle: GMO あおぞら API 仕様、Playwright CSV 取得例、LINK OAuth 文書、MoneyLook 各種、銀行契約条文例、Open Banking 解説など脚注残りの参照群を一タイルに集約する。
