sourceSha256: e07bd56d7126275fd948ccff663d95dde9392a35c6917e93a7f45ead52bc737b
nodes:
  i2:
    title: パスを論理式にした仮想ディレクトリFS
    subtitle: LISFSはディレクトリのパスを論理式として解釈し、クエリ結果のなかを仮想ディレクトリとして移動できる研究プロトタイプで、PadioleauとRidouxがUSENIX ATC 2003で発表した。
  i4:
    title: 検索は速いが作成は桁違いに遅い
    subtitle: 検索はfindより速い一方、ファイル作成は索引の更新が要るため桁違いに遅く、作成中心の負荷が実用化の課題になった。読み取り最適化と書き込みコストのトレードオフが先に立つ。
  i5:
    title: 略称LFSは別のログ構造化方式
    subtitle: 名前が似たLog-structured File Systemは更新をログに追記するストレージ方式で、LISFSが論じる置き場所・検索のモデルとは別研究である。混同を避けるための略称使い分けが本文でも触れられる。
  p48:
    title: 階層型は経路一本で探しにくい
    subtitle: ファイルを探す場面では階層型は1ファイルへの経路が1本しかなく、正確に覚えるか偶然頼みになる。1つのファイルを価格と重さなど複数の独立概念で表すこともできないという欠点が挙げられる。
  p49:
    title: キーワード検索は絞り込み手がかりなし
    subtitle: キーワード検索は複数語の組み合わせから同じファイルへ到達できるが、ヒット一覧だけを返し「次に何で絞るか」を示さない。候補が長いほど次の語当てはユーザーに委ねられる。
  p50:
    title: DBは表現力あるが学習コスト大
    subtitle: データベースはsize>45のような値条件を扱えるが、スキーマと問い合わせ言語の習得が要る。論文はUNIXシェル1時間対SQL40時間の対比で、階層型との学習コスト差を示した。
  p51:
    title: 表：階層・ブール・リレーションの比較
    subtitle: 階層は絞り込みのヒントが出るが経路と配置先は1つ。ブール検索は連言・選言・否定を書けるが結果は一覧で手がかりがない。リレーショナルは複雑な問い合わせに強いがスキーマ学習が要る。
  p52:
    title: 三方式を一つのパス語法に統合
    subtitle: LISFSは階層・ブール・リレーショナルの試みを1インターフェースに載せる。パスの語法を保ったまま階層ナビゲーションとブール式の表現力を両方使う設計が後続の章の前提になる。
  s8:
    title: スラッシュ連言・パイプ選言・否定
    subtitle: 属性はmkdirで登録しcdで式を書きtouchで付与する。区切りの/は論理積でlib/usrとusr/libは同じ。cd /music/!bad/disco|rockのように合取標準形で書き、階層シェルでは書きにくい否定も素の式として扱える。
  s9:
    title: 外延とlsの二種類の答え
    subtitle: 式φの外延は説明がφを満たすファイルの集合で、根のlsは全ファイル。答えは式を広げるincrementsと、それ以上区別できないファイル一覧に分かれる。説明が異なれば同名ファイルも区別できる。
  s10:
    title: mkdirが分類の公理を宣言する
    subtitle: 性質が増えると根のlsは候補だらけになる。mkdirの入れ子でUnix⇒OperatingSystemのような公理を宣言し分類は有向非巡回グラフになる。lsはグラフを上から辿り一般なincrementsだけを先に示す。
  s11:
    title: 仮想ディレクトリへの書き込みと権限
    subtitle: mvは属性の付け替えで集合定義と整合させ、削除や属性変更は所有者に限る。パス順序が無意味なため権限は各属性の連言となり、/tmpのsticky bitと同様に他者ファイルの消去を防ぐ発想がある。
  s13:
    title: PerlFS上の索引と行列実装
    subtitle: プロトタイプはPerlFS上にBerkeley DBでメタデータを置き本体はEXT2に預ける。keyword→objectsとobject→keywordsの行列で外延を事前計算し、作成は祖先集合の更新コストを背負うがlsは疎行列とinodeキャッシュで軽く保たれた。
  s14:
    title: ベンチマークと検索の逆転
    subtitle: AndrewベンチではCopyで索引更新により遅延が顕著だがScanやReadはPerlFS同程度。関数検索はfind2.899秒に対lookup0.081秒。ls changeはincrements110件でaproposより件数が少なく分類道筋を含む。
  s16:
    title: SFSとの差は属性付与と内部移動
    subtitle: Semantic File Systemはtransducerで属性を自動抽出し仮想ディレクトリを問い合わせとする先行研究。LISFSはユーザーが属性を付け、仮想ディレクトリの中をさらに移動でき、結果内ナビゲーションを別モードにしない点が異なる。
  s17:
    title: 表：非階層FS各方式の限界整理
    subtitle: SFSは自動属性のみで結果内移動なし。HACはクエリ答えを実ディレクトリ化し矛盾を書ける。BeFSはUNIX非互換。Nebulaは名前付きクエリだが答えの中は移動不可。LiFSはフラッシュ想定で内容は扱わない。
  s18:
    title: デスクトップ検索との配置の違い
    subtitle: Google DesktopやSpotlightは索引を別アプリが検索に使う。LISFSは索引と検索手段そのものをファイルシステムに置き、シェル操作と問い合わせを同一インターフェースで混ぜられる立場をICSE2006が対比として挙げる。
  s20:
    title: LISとFCAから論理概念分析へ
    subtitle: Logic Information Systemはスキーマの代わりに論理式体系を置き、説明もクエリも同じ式で書く。FCAの概念格を全構築せず1経路だけ計算し、CameliSは写真コレクションで分類論理ナビゲーションの応用例となる。
  s21:
    title: ファイル内部まで扱うPofFS層
    subtitle: inter-fileに加えintra-file層がありPofFSとしてUSENIX2005で報告された。ファイルをマウント点とみなし性質で部分を選んで1ファイルとして読み、複数見方の編集を元ファイルへ戻す。大規模ソースの役割別編集が想定される。
  s22:
    title: メール索引とソフトウェア横断応用
    subtitle: "メール16万件でtransducerとGlimpseを組み、contains:fooでヒット一覧ではなくincrementsへ至る道を計算した。工数文脈では型・継承・命名・コメントを1索引にまとめるが、関係は当時1オブジェクト述語のみでICCS2005が拡張を提案した。"
  s24:
    title: 検索と移動の境界が消えた点
    subtitle: 問い合わせとナビゲーションをFSインターフェース内で制限なく組み合わせ、仮想ディレクトリ書き込みでも整合を保つ。intrinsicとextrinsic属性を同じ式で扱い、検索と移動の操作区別がなくなった点が新しさとして強調される。
  s25:
    title: 索引更新が最大の未解決課題
    subtitle: 作成はオンライン索引構築で祖先まで書き換えコストが大きく、1万ファイル付近で頭打ち。述語は1オブジェクト1性質で関係は不便だった。2026年時点で主要OS採用はなく配布も途絶えたが、仮想ディレクトリやタグの断片は別経路で浸透した。
  s26:
    title: LFSはディスク書き込みの別研究
    subtitle: Log-structured File Systemは全更新をログ追記し書き込み速度とクラッシュ回復を改善する1991年の方式。LISFSは置き場所と検索モデル、LFSはディスク書き込み方を論じ、略称は混同回避のために使い分けられた。
  i29:
    title: LIS理論の細部は本文範囲外
    subtitle: ラベル付け作用素、亜種の論理、確信度を含む索引など理論側の詳細は出典8と10にあり、本レポートは実装挙動への影響を追っていない。調査しなかった枝として明示的に切り分けている。
  i30:
    title: LtUのProlog内蔵は二次情報
    subtitle: Lambda the Ultimateの会議レポートはプロトタイプがProlog解釈系を内蔵していたと伝えるが一次資料ではない。本文では報告として扱い、実装構成の確定事実としては採用していない。
  i33:
    title: 出典1：ATC2003原論文
    subtitle: Yoann Padioleau, Olivier Ridoux「A Logic File System.」USENIX Annual Technical Conference, 2003。パス論理式・外延・increments・実装計測の一次資料。
  i34:
    title: 出典2：ICSE2006ファイルシステム論
    subtitle: "Yoann Padioleau et al.「LISFS: a Logical Information System as a File System.」ICSE, 2006。デスクトップ検索対比、対話的利用のスケール、メール実験など後続評価のまとめ。"
  i35:
    title: 出典3：PofFS USENIX2005
    subtitle: Yoann Padioleau, Olivier Ridoux「A Parts-of-File File System.」USENIX ATC, 2005。intra-file層とファイル内部部分の扱い、大規模ソース編集の報告。
  i36:
    title: 出典4：Wikipedia概説
    subtitle: Wikipedia「Logic File System.」LISFSの概説と背景への入口。本文では三方式統合の文脈で参照している。
  i37:
    title: 出典5：LtU会議レポート
    subtitle: Lambda the Ultimate「A Logic File System (conference report).」2003。Prolog内蔵の伝承を含む二次報告で、本文では一次資料ではない旨を注記している。
  i38:
    title: 出典6：Semantic File Systems
    subtitle: David K. Gifford et al.「Semantic File Systems.」SOSP, 1991。transducerと仮想ディレクトリの先行研究。LISFSのtransducer継承と差分の比較基準。
  i39:
    title: 出典7：HAC OSDI1999
    subtitle: Burra Gopal, Udi Manber「Integrating Content-based Access Mechanisms with Hierarchical File Systems.」OSDI, 1999。階層と内容検索の統合と、実ディレクトリ化による矛盾の指摘。
  i40:
    title: 出典8：Logical Information Systems入門
    subtitle: Sébastien Ferré, Olivier Ridoux「Introduction to Logical Information Systems.」INRIA RR-4540 / IP&M, 2004。LIS枠組みと論理概念分析の理論基盤。
  i41:
    title: 出典9：ソフトウェア工数への応用
    subtitle: Benjamin Sigonneau, Olivier Ridoux「Software Engineering Applications of Logic File System.」MSR, 2006。型・継承・命名など複数基準を1索引にまとめ横断探索する例。
  i42:
    title: 出典10：関係を含むFCA拡張
    subtitle: Sébastien Ferré et al.「Arbitrary Relations in Formal Concept Analysis and Logical Information Systems.」ICCS, 2005。オブジェクト間関係を直接扱う理論拡張。広い採用には至らなかった。
  i44:
    title: 出典12：LiFS MSST2005
    subtitle: 「Richer File System Metadata Using Links and Attributes」(LiFS). MSST, 2005。属性とリンクのメタデータ。フラッシュ想定でファイル内容は扱わない点が比較表の限界として挙がる。
  i45:
    title: 出典13：IRISA活動報告2006
    subtitle: IRISA Team-LIS「LISFS activity report 2006.」研究チームの活動整理。PofFSや応用の補助資料として本文が参照する。
  more53:
    title: 出典14・15：ミラーとLFS原論文
    subtitle: "[14]はGitHub上のlogic file systemソースミラー。[15]はRosenblumとOusterhoutのLog-structured File System (SOSP 1991)。LISFS略称の混同回避と配布状況の補足。"
