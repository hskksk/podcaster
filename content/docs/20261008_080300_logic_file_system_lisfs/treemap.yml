sourceSha256: e07bd56d7126275fd948ccff663d95dde9392a35c6917e93a7f45ead52bc737b
nodes:
  i2:
    title: パスを論理式にした仮想ディレクトリFS
    subtitle: LISFSはディレクトリのパスを論理式として解釈し、クエリ結果のなかを仮想ディレクトリとして移動できる研究プロトタイプで、PadioleauとRidouxがUSENIX ATC 2003で発表した。
  i4:
    title: 検索は速いが作成は桁違いに遅い
    subtitle: 検索はfindより速い一方、ファイル作成は索引の更新が要るため桁違いに遅く、作成中心の負荷が実用化の課題になった。読み取り最適化と書き込みコストのトレードオフが先に立つ。
  i5:
    title: 略称LFSは別のログ構造化方式
    subtitle: 名前が似たLog-structured File Systemは更新をログに追記するストレージ方式で、LISFSが論じる置き場所・検索のモデルとは別研究である。混同を避けるための略称使い分けが本文でも触れられる。
  p48:
    title: 階層型は経路一本で探しにくい
    subtitle: ファイルを探す場面では階層型は1ファイルへの経路が1本しかなく、正確に覚えるか偶然頼みになる。1つのファイルを価格と重さなど複数の独立概念で表すこともできないという欠点が挙げられる。
  p49:
    title: キーワード検索は絞り込み手がかりなし
    subtitle: キーワード検索は複数語の組み合わせから同じファイルへ到達できるが、ヒット一覧だけを返し「次に何で絞るか」を示さない。候補が長いほど次の語当てはユーザーに委ねられる。
  p50:
    title: DBは表現力あるが学習コスト大
    subtitle: データベースはsize>45のような値条件を扱えるが、スキーマと問い合わせ言語の習得が要る。論文はUNIXシェル1時間対SQL40時間の対比で、階層型との学習コスト差を示した。
  p51:
    title: 表：階層・ブール・リレーションの比較
    subtitle: 階層は絞り込みのヒントが出るが経路と配置先は1つ。ブール検索は連言・選言・否定を書けるが結果は一覧で手がかりがない。リレーショナルは複雑な問い合わせに強いがスキーマ学習が要る。
  p52:
    title: 三方式を一つのパス語法に統合
    subtitle: LISFSは階層・ブール・リレーショナルの試みを1インターフェースに載せる。パスの語法を保ったまま階層ナビゲーションとブール式の表現力を両方使う設計が後続の章の前提になる。
  s8:
    title: スラッシュ連言・パイプ選言・否定
    subtitle: 属性はmkdirで登録しcdで式を書く。/は論理積でlib/usrとusr/libは同じ場所。!bad/disco|rockの例のように否定と選言を階層シェルより素直に書ける合取標準形で表現する。
  s9:
    title: 外延とlsの二種類の答え
    subtitle: 式φの外延は説明がφを満たすファイルの集合で、根のlsは全ファイル。答えは式を広げるincrementsと、それ以上区別できないファイル一覧に分かれる。説明が異なれば同名ファイルも区別できる。
  s10:
    title: mkdirが分類の公理を宣言する
    subtitle: 性質が増えると根のlsは候補だらけになる。mkdirの入れ子でUnix⇒OperatingSystemのような公理を宣言し分類は有向非巡回グラフになる。lsはグラフを上から辿り一般なincrementsだけを先に示す。
  s11:
    title: 仮想ディレクトリへの書き込みと権限
    subtitle: mvは属性の付け替えで集合定義と整合させ、削除や属性変更は所有者に限る。パス順序が無意味なため権限は各属性の連言となり、/tmpのsticky bitと同様に他者ファイルの消去を防ぐ発想がある。
  s13:
    title: PerlFS上の索引と行列実装
    subtitle: PerlFS上にBerkeley DBでメタデータを置き本体はEXT2。性質とファイルの双方向索引で外延を事前計算する。作成は祖先更新が重いが、lsは疎な行列演算とディレクトリinodeキャッシュで軽量に保たれた。
  s14:
    title: ベンチマークと検索の逆転
    subtitle: Andrewベンチでは作成中心のCopyが特に遅いが読み取り系はPerlFS同程度。関数検索はfind約2.9秒に対しlookupは0.08秒級。lsは分類道筋付きのincrementsを返し件数はaproposより抑えられる。
  s16:
    title: SFSとの差は属性付与と内部移動
    subtitle: SFSはtransducerで属性を自動抽出し仮想ディレクトリを問い合わせとする1991年の先行研究。LISFSは手付け属性と結果集合内のさらなる移動を同一モードで扱い、ナビゲーションを切り替えない点が論文の差分として整理される。
  s17:
    title: 表：非階層FS各方式の限界整理
    subtitle: SFSは自動属性のみで結果内移動なし。HACはクエリ答えを実ディレクトリ化し矛盾を書ける。BeFSはUNIX非互換。Nebulaは名前付きクエリだが答えの中は移動不可。LiFSはフラッシュ想定で内容は扱わない。
  s18:
    title: デスクトップ検索との配置の違い
    subtitle: 同時期のデスクトップ検索は索引を別アプリが担う。LISFSは索引と検索をFS本体に置き、シェル上で問い合わせと移動を混ぜられる。ICSE2006がこの配置の違いを対比として述べる。
  s20:
    title: LISとFCAから論理概念分析へ
    subtitle: LISはスキーマの代わりに論理式体系を置き、説明とクエリを同じ式で書く。概念格全体は作らず必要な経路だけ計算する。CameliSは個人写真整理で分類論理ナビの応用例として触れられる。
  s21:
    title: ファイル内部まで扱うPofFS層
    subtitle: ファイル単位に加え内部部分を扱うPofFS層がUSENIX2005で報告される。ファイルをマウント点とみなし性質で部分を選び、複数の見方から編集して元へ戻す。大規模ソースの役割別編集が想定される。
  s22:
    title: メール索引とソフトウェア横断応用
    subtitle: "メール大量実験ではtransducer索引と全文検索を組み、contains指定で一覧ではなくincrementsへの道を返す。工数応用では型や命名を横断するが、関係述語は当時限られICCS2005が拡張を提案した。"
  s24:
    title: 検索と移動の境界が消えた点
    subtitle: 問い合わせとナビゲーションをFS内で自由に組み合わせ、仮想ディレクトリへの書き込みでも整合を保つ。自動抽出と手付け属性を同じ式で扱い、検索と移動の区別が消えた点が成果として繰り返し強調される。
  s25:
    title: 索引更新が最大の未解決課題
    subtitle: 作成は祖先までの索引更新が重く、規模増で1万ファイル付近に頭打ちが見える。関係述語の表現も制約が残る。2026年時点でOS標準採用はないが、仮想ディレクトリやタグの思想は別製品へ断片的に残った。
  s26:
    title: LFSはディスク書き込みの別研究
    subtitle: LFSは更新をログへ追記して書き込みと回復を改善する1991年のストレージ研究。LISFSはファイルの置き方と検索の話であり、ディスクレイアウトとは無関係。略称LISFSはこの混同を避けるためとされる。
  i29:
    title: LIS理論の細部は本文範囲外
    subtitle: ラベル付け作用素、亜種の論理、確信度を含む索引など理論側の詳細は出典8と10にあり、本レポートは実装挙動への影響を追っていない。調査しなかった枝として明示的に切り分けている。
  i30:
    title: LtUのProlog内蔵は二次情報
    subtitle: Lambda the Ultimateの会議レポートはプロトタイプがProlog解釈系を内蔵していたと伝えるが一次資料ではない。本文では報告として扱い、実装構成の確定事実としては採用していない。
  i33:
    title: 出典1：ATC2003原論文
    subtitle: PadioleauとRidouxのUSENIX ATC 2003原論文。パス論理式、外延とincrements、仮想ディレクトリへの書き込み、プロトタイプ構成とベンチマークの主要な一次資料として本文全体の基盤になる。
  i34:
    title: 出典2：ICSE2006ファイルシステム論
    subtitle: "ICSE 2006のLISFS総合論。デスクトップ検索との対比、約10万オブジェクトまでの対話利用、メール索引実験など、2003年論文以降の評価と応用をまとめる後続の中心文献。"
  i35:
    title: 出典3：PofFS USENIX2005
    subtitle: PofFSのUSENIX 2005論文。ファイル内部の部分を性質で選び別ファイルとして扱うintra-file層の報告。LISFSの二層構造のうち、大規模ソース編集の用途を補強する。
  i36:
    title: 出典4：Wikipedia概説
    subtitle: WikipediaのLogic File System項目。LISFSの概説と背景への入口として、階層・ブール・リレーショナルを一つのパス語法に載せる試みの文脈で本文が参照している。
  i37:
    title: 出典5：LtU会議レポート
    subtitle: Lambda the Ultimate「A Logic File System (conference report).」2003。Prolog内蔵の伝承を含む二次報告で、本文では一次資料ではない旨を注記している。
  i38:
    title: 出典6：SFS原論文1991
    subtitle: GiffordらのSemantic File Systems (SOSP 1991)。transducerによる属性抽出と仮想ディレクトリ問い合わせの先行研究。LISFSがtransducerを継承しつつ内部移動で差を取る比較の基準。
  i39:
    title: 出典7：HAC OSDI1999
    subtitle: HAC (OSDI 1999)。階層FSと内容ベース検索の統合。クエリ結果を実ディレクトリにすると書き込みが問い合わせと矛盾しうる点を、LISFSとの比較で本文が指摘する根拠。
  i40:
    title: 出典8：LIS理論の入門
    subtitle: FerréとRidouxのLIS入門論文 (INRIA RR-4540 / IP&M 2004)。論理概念分析の枠組みと、LISFS背後のLogic Information Systemの理論基盤を説明する。
  i41:
    title: 出典9：ソフトウェア工数への応用
    subtitle: MSR 2006のソフトウェア工数応用論。型同型・継承・命名規約・コメント語を1索引にまとめ、ソースやコンポーネントを横断して辿る例として理論章の応用が参照する。
  i42:
    title: 出典10：関係を含むFCA拡張
    subtitle: ICCS 2005の関係述語拡張論。1オブジェクト1性質の制約を超え、オブジェクト間関係を直接扱う理論整備。LISFS実装への広い取り込みには至らなかったが未解決点の補足として触れる。
  i44:
    title: 出典12：LiFS MSST2005
    subtitle: LiFS (MSST 2005)。リンクと属性でメタデータを豊かにする方式。フラッシュメモリ想定でファイル内容は扱わない点が、非階層FS比較表でLISFSとの差として整理される。
  i45:
    title: 出典13：IRISA活動報告2006
    subtitle: IRISA Team-LISの2006活動報告。PofFSやLISFS周辺の研究活動の整理資料。本文では補助的な背景として触れ、実装詳細の一次根拠ではない。
  more53:
    title: 出典14・15：ミラーとLFS原論文
    subtitle: "[14]はGitHubのソースミラーで公式配布終了後もコードを読める。[15]はログ構造化ファイルシステム原論文。TL;DRと末尾でLISFS略称がLFSと混同されない旨を補う。"
