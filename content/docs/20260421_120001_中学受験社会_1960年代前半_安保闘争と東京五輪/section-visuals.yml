  - sectionId: "日米安全保障条約とは"
    engine: article-visual
    engineVersion: "1"
    alt: "旧安保は米国防衛義務が曖昧だったが、新安保1960年は防衛義務の明文化、事前協議制、10年有効期限を導入した。"
    spec:
      type: comparison
      title: 新安保は義務と事前協議を明文化
      sides:
        - label: 旧安保
        - label: 新安保
      rows:
        - axis: 米国の義務
          cells:
            - label: 曖昧
            - label: 防衛を明文化
              emphasis: true
        - axis: 協議
          cells:
            - label: 限定
            - label: 事前協議制
        - axis: 期限
          cells:
            - label: なし
            - label: 10年と自動延長

  - sectionId: "所得倍増計画とは"
    engine: article-visual
    engineVersion: "1"
    alt: "池田内閣は1960年12月に10年で所得2倍を掲げ、社会資本・教育・重化学の三柱で約7年で達成した。"
    spec:
      type: cards
      title: 所得倍増の三本柱
      items:
        - label: 社会資本
          detail: 道路・港湾・団地
        - label: 人的能力
          detail: 教育投資
        - label: 重化学工業
          detail: 太平洋ベルト
          emphasis: true

