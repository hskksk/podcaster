  - sectionId: "背景戦後日本のスタートライン"
    engine: article-visual
    engineVersion: "1"
    alt: "敗戦後はGHQ占領下で1947年憲法施行、1951年講和と1952年占領終了。朝鮮特需で1955年頃から年10%前後の成長が始まった。"
